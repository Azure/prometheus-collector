              echo $TESTKUBE_RESULTS_OTEL > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-partial-no-pcs-v1.json"
              rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"
            displayName: "Create TestKube Results Summary (partial v1)"
            condition: always()

          # v2 (regression test for the ParseMetricsFiles fix)
          - bash: |
              # Delete the existing settings configmap first so the partial fixture is applied
              # cleanly without leaving a stale prometheus-collector-settings key behind.
              kubectl delete configmap ama-metrics-settings-configmap -n kube-system --ignore-not-found
              kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-partial-no-pcs-v2.yaml

              # Force a clean re-parse of the partial configmap on startup.
              kubectl rollout restart deployment/ama-metrics -n kube-system
              kubectl rollout status deployment/ama-metrics -n kube-system --timeout=300s

              export BUILD_ARTIFACTSTAGINGDIRECTORY="$(Build.ArtifactStagingDirectory)"
              export BUILD_BUILDID="$(Build.BuildId)"
              export SYSTEM_JOBID="$(System.JobId)"
              export SYSTEM_TASKINSTANCEID="$(System.TaskInstanceId)"

              chmod +x ./testkube/run-testkube-workflow.sh
              ./testkube/run-testkube-workflow.sh \
                "${{ parameters.AMW_QUERY_ENDPOINT }}" \
                "${{ parameters.AZURE_CLIENT_ID }}" \
                "testkube-config-test-partial-no-pcs-v2-crs.yaml" \
                "testkube-config-test-partial-no-pcs-v2-crs.yaml" \
                "false" \
                "480" \
                "ConfigTests" \
                "${{ parameters.branch }}"
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Run tests for partial v2 configmap (no prometheus-collector-settings)"
            continueOnError: true

          - bash: |
              TESTKUBE_RESULTS_OTEL=$(jq -c '.environment="partial-no-pcs-v2"' "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json" | tr -d '\n\r')
              echo $TESTKUBE_RESULTS_OTEL
              echo $TESTKUBE_RESULTS_OTEL > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-partial-no-pcs-v2.json"
              rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"

              # Restore the default settings configmap for subsequent runs.
              kubectl apply -f ./test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Create TestKube Results Summary and restore default settings configmap"
            condition: always()

          - bash: |
              set -euo pipefail
              umask 077
              snapshot="$(mktemp -d "$(Agent.TempDirectory)/customer-settings.XXXXXX")"
              configmaps=(ama-metrics-settings-configmap ama-metrics-prometheus-config ama-metrics-prometheus-config-node ama-metrics-prometheus-config-node-windows)
              for ns in ama-settings-included ama-settings-excluded; do
                existing="$(kubectl get namespace "$ns" --ignore-not-found -o name)"
                if [[ -n "$existing" ]]; then
                  echo "Refusing to overwrite existing namespace $ns" >&2
                  exit 1
                fi
              done
              for cm in "${configmaps[@]}"; do
                kubectl get configmap "$cm" -n kube-system --ignore-not-found -o json \
                  | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration")' \
                  > "$snapshot/$cm.json"
              done
              restore() {
                local failed=0
                kubectl delete -f ./scenarios/settings/annotation-targets.yaml --ignore-not-found || failed=1
                for cm in "${configmaps[@]}"; do
                  if [[ -s "$snapshot/$cm.json" ]]; then
                    kubectl apply -f "$snapshot/$cm.json" || failed=1
                    cmp -s <(jq -S '{data,binaryData}' "$snapshot/$cm.json") \
                      <(kubectl get configmap "$cm" -n kube-system -o json | jq -S '{data,binaryData}') || failed=1
                  else
                    kubectl delete configmap "$cm" -n kube-system --ignore-not-found || failed=1
                    remaining="$(kubectl get configmap "$cm" -n kube-system --ignore-not-found -o name)" || failed=1
                    [[ -z "$remaining" ]] || failed=1
                  fi
                done
                if [[ "$failed" == 0 ]]; then
                  for cm in "${configmaps[@]}"; do rm -f -- "$snapshot/$cm.json"; done
                  rmdir "$snapshot"
                else
                  echo "Customer settings cleanup failed; snapshots retained in $snapshot" >&2
                fi
                return "$failed"
              }
              trap 'rc=$?; trap - EXIT; restore || rc=1; exit "$rc"' EXIT
              trap 'exit 130' INT
              trap 'exit 143' TERM
              kubectl apply -f ./scenarios/settings/annotation-targets.yaml
              for cm in "${configmaps[@]}"; do
                kubectl delete configmap "$cm" -n kube-system --ignore-not-found
              done
              export BUILD_ARTIFACTSTAGINGDIRECTORY="$(Build.ArtifactStagingDirectory)"
              export BUILD_BUILDID="$(Build.BuildId)"
              export SYSTEM_JOBID="$(System.JobId)"
              export SYSTEM_TASKINSTANCEID="$(System.TaskInstanceId)"
              failed=0
              for version in v1 v2; do
                kubectl apply -f "./scenarios/settings/customer-settings-$version/settings.yaml"
                if bash ./testkube/run-testkube-workflow.sh \
                  "${{ parameters.AMW_QUERY_ENDPOINT }}" \
                  "${{ parameters.AZURE_CLIENT_ID }}" \
                  "testkube-config-test-customer-settings-$version-crs.yaml" \
                  "testkube-config-test-customer-settings-$version-crs.yaml" \
                  false 480 ConfigTests "${{ parameters.branch }}"; then
                  echo "Customer settings $version passed"
                else
                  failed=1
                fi
                jq --arg environment "customer-settings-$version" '.environment=$environment' \
                  "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json" \
                  > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-customer-settings-$version.json"
                rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"
              done
              exit "$failed"
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Run customer ConfigMap alias and annotation scenarios (v1 and v2)"
            continueOnError: true

          - bash: |
              set -euo pipefail
              kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-dcgm.yaml
              export BUILD_ARTIFACTSTAGINGDIRECTORY="$(Build.ArtifactStagingDirectory)"
              bash ./testkube/run-testkube-workflow.sh \
                "${{ parameters.AMW_QUERY_ENDPOINT }}" \
                "${{ parameters.AZURE_CLIENT_ID }}" \
                "testkube-config-test-dcgm-crs.yaml" \
                "testkube-config-test-dcgm-crs.yaml" false 480 ConfigTests \
                "${{ parameters.branch }}"
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Run DCGM custom interval and keep-list configuration assertions"
            continueOnError: true

          - bash: |
              set -euo pipefail
              jq '.environment="dcgm-custom"' "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json" \
                > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-dcgm-custom.json"
              rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"
            displayName: "Save DCGM TestKube result"
            condition: always()

          # List created files
          - bash: |
              echo "Results files created:"
              ls -la "$(Build.ArtifactStagingDirectory)/testkube-results/"
            displayName: "List Results Files"

          - bash: |
              export SYSTEM_PULLREQUEST_PULLREQUESTTITLE="$(System.PullRequest.PullRequestTitle)"
              export SYSTEM_PULLREQUEST_PULLREQUESTNUMBER="$(System.PullRequest.PullRequestNumber)"
              export BUILD_REASON="$(Build.Reason)"
              export BUILD_SOURCEVERSIONMESSAGE="$(Build.SourceVersionMessage)"
              export BUILD_SOURCEBRANCHNAME="$(Build.SourceBranchName)"
              export BUILD_BUILDNUMBER="$(Build.BuildNumber)"
              export SYSTEM_COLLECTIONURI="$(System.CollectionUri)"
              export SYSTEM_TEAMPROJECT="$(System.TeamProject)"
              export BUILD_BUILDID="$(Build.BuildId)"
              chmod +x ./otelcollector/test/testkube/send-testkube-summary.sh
              ./otelcollector/test/testkube/send-testkube-summary.sh "$TEAMS_WEBHOOK_URL" "$(Build.ArtifactStagingDirectory)/testkube-results"
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Send TestKube Summary Notification"
            env:
              TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
            condition: always()

          - bash: |
              set -euo pipefail
              python3 ./otelcollector/test/testkube/workflow_evidence.py gate \
                "$(Build.ArtifactStagingDirectory)/testkube-results" \
                no-configmaps all-targets-disabled default-targets-on \
                all-rs-targets-enabled all-ds-targets-enabled all-targets-enabled \
                only-custom-configmap global-settings custom-node-configmap \
                basic-auth-smon basic-auth-secret-update basic-auth-smon-v2 basic-auth-secret-update-v2 \
                settings-error custom-configmap-error global-ext-labels-error controlplane-istio \
                default-targets-on-v2 mip-false deny-fs-access partial-no-pcs-v1 partial-no-pcs-v2 \
                customer-settings-v1 customer-settings-v2 dcgm-custom
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Require every ConfigTests scenario and retained execution evidence to pass"
            condition: always()

          - task: PublishTestResults@2
            displayName: "Publish TestKube Ginkgo JUnit"
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/testkube-executions/**/junit.xml'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              testRunTitle: ConfigTests

          - task: PublishPipelineArtifact@1
            displayName: "Retain TestKube submissions, executions and reports"
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: configtests-evidence

- stage: CandidateCapacity
  displayName: Read-only regional admission before candidate provisioning
  condition: and(not(canceled()), or(eq('${{ parameters.candidateMode }}', 'True'), eq(variables['Build.Reason'], 'ResourceTrigger'), and(eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/sre/vuln/'), contains(variables['System.PullRequest.SourceBranch'], '/ama-metrics-sre-')))))
  jobs:
  - job: Capacity
    timeoutInMinutes: 240
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    variables:
      capacityRoot: $(Agent.TempDirectory)/candidate-capacity-source-$(Build.BuildId)
      capacityEvidence: $(Build.ArtifactStagingDirectory)/candidate-capacity-$(Build.BuildId)
      capacityPython: $(Agent.TempDirectory)/candidate-capacity-python-$(Build.BuildId)
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - bash: |
        set -euo pipefail
        sha="$CANDIDATE_SOURCE_SHA"
        producer="$PRODUCER_BUILD_ID"
        if [[ "$BUILD_REASON" == PullRequest ]]; then
          [[ "$PR_SOURCE_BRANCH" =~ ^refs/heads/(sre/vuln/[A-Za-z0-9][A-Za-z0-9._-]*|[^/]+/ama-metrics-sre-[^/]+)$ ]] || exit 1
          sha="$PR_SOURCE_COMMIT"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "PR head is missing" >&2; exit 1; }
          producer=""
          for attempt in $(seq 1 180); do
            resolved="$(python3 "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
              --resolve-producer --source-commit "$sha" --source-branch "$PR_SOURCE_BRANCH")"
            producer="$(printf '%s' "$resolved" | python3 -c 'import json,sys; print(json.load(sys.stdin)["buildId"] or "")')"
            [[ -z "$producer" ]] || break
            sleep 60
          done
        fi
        [[ "$sha" =~ ^[0-9a-f]{40}$ && "$producer" =~ ^[1-9][0-9]*$ && ! -e "$CAPACITY_ROOT" ]] || { echo "Capacity admission requires a producer and new exact-source checkout" >&2; exit 1; }
        git fetch --no-tags origin "$sha"
        git worktree add --detach "$CAPACITY_ROOT" "$sha"
        [[ "$(git -C "$CAPACITY_ROOT" rev-parse HEAD)" == "$sha" && -z "$(git -C "$CAPACITY_ROOT" status --porcelain)" ]]
        echo "##vso[task.setvariable variable=capacitySourceSha]$sha"
        echo "##vso[task.setvariable variable=capacityProducerBuildId]$producer"
        # Also applies to apt invocations inside the Azure CLI installer.
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99ama-metrics-lock-timeout >/dev/null
        command -v az || curl --fail --silent --show-error --location --retry 3 https://aka.ms/InstallAzureCLIDeb | sudo bash
        az bicep install
        sudo install -m 0755 "${AZURE_CONFIG_DIR:-$HOME/.azure}/bin/bicep" /usr/local/bin/bicep
        echo "##vso[task.setvariable variable=AZURE_BICEP_USE_BINARY_FROM_PATH]true"
        python3 -m venv "$CAPACITY_PYTHON"
        "$CAPACITY_PYTHON/bin/python" -m pip install -r "$BUILD_SOURCESDIRECTORY/otelcollector/test/scenarios/clusters/requirements.txt"
      displayName: Prepare exact-source read-only capacity tools
      env:
        BUILD_REASON: $(Build.Reason)
        PR_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
        PR_SOURCE_COMMIT: $(System.PullRequest.SourceCommitId)
        CANDIDATE_SOURCE_SHA: $(campaignSourceSha)
        PRODUCER_BUILD_ID: $(campaignProducerBuildId)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        CAPACITY_ROOT: $(capacityRoot)
        CAPACITY_PYTHON: $(capacityPython)
    - task: AzureCLI@2
      name: admit
      displayName: Check aggregate regional peaks before any provisioning
      inputs:
        azureSubscription: ${{ parameters.subscriptionName }}(${{ parameters.subscriptionID }})
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb ]] || { echo "Capacity admission requires the approved build subscription" >&2; exit 1; }
          [[ "$(git -C "$CAPACITY_ROOT" rev-parse HEAD)" == "$CANDIDATE_SOURCE_SHA" ]]
          [[ "$TEST_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git -C "$BUILD_SOURCESDIRECTORY" rev-parse HEAD)" == "$TEST_SOURCE_SHA" ]] || { echo "Capacity test source does not match this pipeline revision" >&2; exit 1; }
          validation_args=()
          case "$CANDIDATE_SCENARIO" in ampls|ampls-acns) validation_args=(--validate-ampls) ;; esac
          "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/otelcollector/test/scenarios/run-scenario.py" campaign-preflight \
            "${validation_args[@]}" \
            --source-root "$CAPACITY_ROOT" --scenario "$CANDIDATE_SCENARIO" \
            --test-source-root "$BUILD_SOURCESDIRECTORY" --test-source-sha "$TEST_SOURCE_SHA" \
            --build-id "$PRODUCER_BUILD_ID" --evidence "$CAPACITY_EVIDENCE"
          "$PYTHON" - "$CAPACITY_EVIDENCE/campaign-preflight.json" <<'PY'
          import json, os, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = os.environ["CANDIDATE_SCENARIO"]
          scenarios = "default,classic-azure-cni,acns,otlp".split(",")
          selected = scenarios if expected == "all" else [expected]
          if (value.get("status") != "PASS" or value.get("sourceSha") != os.environ["CANDIDATE_SOURCE_SHA"]
                  or value.get("testSourceSha") != os.environ["TEST_SOURCE_SHA"]
                  or value.get("buildId") != int(os.environ["PRODUCER_BUILD_ID"])
                  or value.get("capacityReserved") is not False
                  or set(value.get("placements", {})) != set(selected)
                  or set(value.get("existing", {})) != set(selected)
                  or any(type(value["existing"][name]) is not bool for name in selected)):
              raise ValueError("Aggregate capacity admission source/build/placement contract mismatch")
          for scenario, region in value["placements"].items():
              if region not in ("centralus", "eastus2", "westcentralus") or region not in value.get("regions", {}):
                  raise ValueError("Aggregate capacity admission has no approved regional proof")
          for scenario, region in value["placements"].items():
              key = scenario.replace("-", "_")
              print(f"##vso[task.setvariable variable=location_{key};isOutput=true]{region}")
              print(f"##vso[task.setvariable variable=existing_{key};isOutput=true]{str(value['existing'][scenario]).lower()}")
          print(f"##vso[task.setvariable variable=sourceSha;isOutput=true]{value['sourceSha']}")
          print(f"##vso[task.setvariable variable=testSourceSha;isOutput=true]{value['testSourceSha']}")
          print(f"##vso[task.setvariable variable=validationBuildId;isOutput=true]{os.environ['BUILD_BUILDID']}")
          PY
      env:
        CAPACITY_ROOT: $(capacityRoot)
        CAPACITY_EVIDENCE: $(capacityEvidence)
        CANDIDATE_SOURCE_SHA: $(capacitySourceSha)
        TEST_SOURCE_SHA: $(Build.SourceVersion)
        PRODUCER_BUILD_ID: $(capacityProducerBuildId)
        CANDIDATE_SCENARIO: ${{ parameters.candidateScenario }}
        PYTHON: $(capacityPython)/bin/python
    - bash: |
        set -euo pipefail
        mkdir -p "$CAPACITY_EVIDENCE"
        printf 'Job status: %s\nThis diagnostic is not capacity admission proof; require the source-bound campaign-preflight.json PASS.\n' \
          "$AGENT_JOBSTATUS" > "$CAPACITY_EVIDENCE/job-status.txt"
      displayName: Retain capacity job diagnostic even when setup fails
      condition: always()
      env:
        CAPACITY_EVIDENCE: $(capacityEvidence)
    - task: PublishPipelineArtifact@1
      displayName: Retain point-in-time aggregate capacity admission, not a reservation
      condition: always()
      inputs:
        targetPath: $(capacityEvidence)
        artifact: candidate-capacity-$(Build.BuildId)

- ${{ each scenario in split('default,classic-azure-cni,acns,otlp,ampls,ampls-acns', ',') }}:
  - ${{ if or(and(eq(parameters.candidateScenario, 'all'), not(in(scenario, 'ampls', 'ampls-acns'))), eq(parameters.candidateScenario, scenario)) }}:
    - stage: Candidate_${{ replace(scenario, '-', '_') }}
      displayName: Candidate ${{ scenario }}
      lockBehavior: sequential
      dependsOn:
      - CandidateCapacity
      condition: and(not(canceled()), eq(dependencies.CandidateCapacity.result, 'Succeeded'))
      variables:
        candidateLocation: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.location_${{ replace(scenario, '-', '_') }}'] ]
        candidateExisting: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.existing_${{ replace(scenario, '-', '_') }}'] ]
        candidateCapacitySourceSha: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.sourceSha'] ]
        candidateCapacityTestSourceSha: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.testSourceSha'] ]
        candidateCapacityBuildId: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.validationBuildId'] ]
      jobs:
      - deployment: CandidateTestkube
        displayName: Test receipt-bound candidate ${{ scenario }}
        environment: Prometheus-Collector-Tests
        timeoutInMinutes: 900
        cancelTimeoutInMinutes: 60
        variables:
          candidateAttempt: $(Build.BuildId)-${{ scenario }}-$(System.StageAttempt)-$(System.JobAttempt)
          candidateRoot: $(Agent.TempDirectory)/candidate-$(candidateAttempt)
          candidateEvidence: $(Agent.TempDirectory)/candidate-evidence-$(candidateAttempt)
          candidateTools: $(Agent.TempDirectory)/candidate-tools-$(candidateAttempt)
          candidatePython: $(Agent.TempDirectory)/candidate-python-$(candidateAttempt)
          candidatePublication: $(Build.ArtifactStagingDirectory)/candidate-$(candidateAttempt)
        pool:
          name: Azure-Pipelines-CI-Test-EO
          image: ci-1es-managed-ubuntu-2204
          os: linux
        strategy:
          runOnce:
            deploy:
              steps:
              - template: azure-template-candidate-config-tests.yml
                parameters:
                  producerBuildId: $(campaignProducerBuildId)
                  sourceSha: $(campaignSourceSha)
                  cve: $(candidateCve)
                  scenario: ${{ scenario }}
                  azureSubscription: ${{ parameters.subscriptionName }}(${{ parameters.subscriptionID }})
