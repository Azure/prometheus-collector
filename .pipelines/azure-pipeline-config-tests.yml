trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main

resources:
  pipelines:
  - pipeline: campaignProducer
    source: Azure.prometheus-collector
    trigger:
      branches:
        include:
        - sre/vuln/*
        - '*/ama-metrics-sre-*'

parameters:
- name: subscriptionName
  displayName: 'Subscription Name'
  type: string
  default: 'ContainerInsights_Build_Subscription'
- name: subscriptionID
  displayName: 'Subscription ID'
  type: string
  default: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
- name: clusterName
  displayName: 'AKS Cluster Name'
  type: string
  default: 'ci-dev-aks-tests'
- name: clusterResourceGroup
  displayName: 'AKS Cluster Resource Group'
  type: string
  default: 'ci-dev-aks-tests'
- name: AMW_QUERY_ENDPOINT
  displayName: 'AMW Query Endpoint'
  type: string
  default: 'https://ci-dev-aks-tests-amw-fcdqc5d4agbyh9en.centralus.prometheus.monitor.azure.com'
- name: AZURE_CLIENT_ID
  displayName: 'Azure Client ID'
  type: string
  default: 'f8b1889c-310c-4913-93c5-3faf0f594f34'
- name: branch
  displayName: 'Branch to run tests from'
  type: string
  default: 'main'
- name: candidateMode
  displayName: 'Run the protected candidate scenario instead of legacy shared-cluster tests'
  type: boolean
  default: false
- name: candidateBuildId
  displayName: 'Successful pipeline 440 producer build ID'
  type: number
  default: 0
- name: candidateSourceSha
  displayName: 'Full candidate source commit'
  type: string
  default: ''
- name: candidateScenario
  displayName: 'Candidate matrix row, or all applicable rows in parallel stages'
  type: string
  default: all
  values:
  - all
  - four-lane
  - default
  - acns
  - otlp
  - acns-cilium
  - operator-secret-watch
  - proxy-custom-ca
  - ampls-proxy
  - ampls
  - proxy

variables:
  HELM_CHART_NAME: 'prometheus-collector'
  ACR_REGISTRY: 'containerinsightsprod.azurecr.io'
  ACR_REPOSITORY: '/public/azuremonitor/containerinsights/cidev/prometheus-collector/images'
  ACR_REPOSITORY_HELM: '/public/azuremonitor/containerinsights/cidev'
  MCR_REGISTRY: 'mcr.microsoft.com'
  MCR_REPOSITORY: '/azuremonitor/containerinsights/cidev/prometheus-collector/images'
  MCR_REPOSITORY_HELM: '/azuremonitor/containerinsights/cidev/prometheus-collector'
  MCR_REPOSITORY_HELM_DEPENDENCIES: '/azuremonitor/containerinsights/cidev'
  BUILD_WINDOWS: true
  Codeql.Enabled: true
  GOLANG_VERSION: '1.24.9'
  TESTKUBE_GOLANG_VERSION: '1.25.9'
  FLUENT_BIT_VERSION: '3.2.2'
  ${{ if eq(parameters.candidateMode, true) }}:
    campaignProducerBuildId: ${{ parameters.candidateBuildId }}
    campaignSourceSha: ${{ parameters.candidateSourceSha }}
  ${{ else }}:
    campaignProducerBuildId: $(resources.pipeline.campaignProducer.runID)
    campaignSourceSha: $(resources.pipeline.campaignProducer.sourceCommit)

stages:
- stage: Deploy
  jobs:
  - deployment: Testkube
    displayName: "Test: AKS testkube tests"
    environment: Prometheus-Collector-Tests
    timeoutInMinutes: 360
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    condition: and(succeeded(), eq('${{ parameters.candidateMode }}', 'False'), ne(variables['Build.Reason'], 'ResourceTrigger'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      skipComponentGovernanceDetection: true
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true

          - bash: |
              # Try apt install first, fall back to official install script
              wget -qO - https://repo.testkube.io/key.pub | sudo apt-key add - && \
              echo "deb https://repo.testkube.io/linux linux main" | sudo tee -a /etc/apt/sources.list && \
              sudo apt-get update && \
              sudo apt-get install -y testkube || \
              curl -sSLf https://get.testkube.io | sudo bash

              # Verify testkube is installed
              which kubectl-testkube || which testkube || { echo "ERROR: testkube CLI not installed"; exit 1; }
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Install testkube CLI"

          - bash: |
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              sudo mv kubectl /usr/local/bin/

              exit 0
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Install kubectl CLI"

          - bash: |
              curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

              exit 0
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Install Azure CLI"

          - bash: |
              set -e
              echo "executing the script to install golang $(GOLANG_VERSION)"
              wget https://go.dev/dl/go$(GOLANG_VERSION).linux-amd64.tar.gz
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf go$(GOLANG_VERSION).linux-amd64.tar.gz --verbose
              export PATH="/usr/local/go/bin:${PATH}"
              echo "##vso[task.prependpath]/usr/local/go/bin"
              go version
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Build: install golang $(GOLANG_VERSION)"

          - bash: |
              set -euo pipefail
              # HelmInstaller@1 downloads a .zip and needs `unzip`, which this agent image
              # does not have. Install the official tarball directly instead.
              HELM_VERSION=v3.12.3
              tmp=$(mktemp -d)
              curl -fsSL --retry 5 --retry-delay 5 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$tmp/helm.tgz"
              tar -xzf "$tmp/helm.tgz" -C "$tmp"
              sudo install -m 0755 "$tmp/linux-amd64/helm" /usr/local/bin/helm
              rm -rf "$tmp"
              helm version
            displayName: "Install Helm for chart regression tests"

          - bash: |
              set -euo pipefail
              # Reuse existing dependencies without running the cluster-backed Ginkgo suite.
              go test -v ../../helmchart/helm_chart_test.go
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test/ginkgo-e2e/configprocessing
            displayName: "Test HPA compatibility and KSM chart arguments"

          - bash: |
              set -euo pipefail
              go test -v ../../scenarios/settings/customer_helm_test.go
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test/ginkgo-e2e/configprocessing
            displayName: "Test customer Helm values"

          - task: UsePythonVersion@0
            displayName: "Select Python for customer settings checks"
            inputs:
              versionSpec: '3.11'

          - bash: |
              set -euo pipefail
              python3 -m venv "$(Agent.TempDirectory)/settings-checks"
              "$(Agent.TempDirectory)/settings-checks/bin/python" -m pip install -r ./scenarios/settings/requirements.txt
              "$(Agent.TempDirectory)/settings-checks/bin/python" ./scenarios/settings/test_catalog.py -v
              (cd ./ginkgo-e2e/configprocessing && go test ../../testkube/config_processing_workflow_test.go ../../testkube/config_pipeline_template_test.go)
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Test customer settings catalog"

          - task: AzureCLI@2
            displayName: Get kubeconfig
            inputs:
                scriptType: 'bash'
                azureSubscription: ${{ parameters.subscriptionName }}(${{ parameters.subscriptionID }})
                scriptLocation: 'inlineScript'
                inlineScript: 'az aks get-credentials -g ${{ parameters.clusterResourceGroup }} -n ${{ parameters.clusterName }}'

          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/testkube-results"
            displayName: "Prepare TestKube results directory"

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-no-configmaps-crs.yaml
              scenario: no-configmaps
              displayName: "Run tests for no configmaps"
              setupScript: |
                # Delete all the configmaps to test the no configmaps case
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-windows-configmap.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-all-targets-disabled-crs.yaml
              scenario: all-targets-disabled
              displayName: "Run tests for all targets disabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-all-targets-disabled.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-default-targets-on-crs.yaml
              scenario: default-targets-on
              displayName: "Run tests for all default targets in settings cfg map enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-defaults-targets-turned-on.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-all-rs-targets-enabled-crs.yaml
              scenario: all-rs-targets-enabled
              displayName: "Run tests for all rs targets in settings cfg map enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-rs-targets-enabled.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-all-ds-targets-enabled-crs.yaml
              scenario: all-ds-targets-enabled
              displayName: "Run tests for all ds targets in settings cfg map enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-ds-targets-enabled.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-all-targets-enabled-crs.yaml
              scenario: all-targets-enabled
              displayName: "Run tests for all targets in settings cfg map enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-all-targets-enabled.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-only-custom-configmap-crs.yaml
              scenario: only-custom-configmap
              displayName: "Run tests for custom configmap with all actions enabled"
              setupScript: |
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-windows-configmap.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-defaults-targets-turned-on.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/custom-config-map/ama-metrics-prometheus-config-configmap-all-actions.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-global-settings-crs.yaml
              scenario: global-settings
              displayName: "Run tests for global ext labels enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-configmap.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-custom-node-configmap-crs.yaml
              scenario: custom-node-configmap
              displayName: "Run tests for custom node configmap enabled"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/custom-config-map/ama-metrics-prometheus-config-configmap-all-actions.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-configmap.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-windows-configmap.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-basic-auth-smon-crs.yaml
              scenario: basic-auth-smon
              displayName: "Run tests for basic auth ServiceMonitor"
              setupScript: |
                # Deploy basic-auth test resources
                kubectl apply -f ./test-cluster-yamls/basic-auth/namespace.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/secret.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/deployment.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/servicemonitor.yaml

                # Detect K8s version and conditionally apply >= 1.37 resources
                KUBE_MINOR=$(kubectl version -o json | jq -r '.serverVersion.minor' | tr -d '+')
                echo "Kubernetes minor version: $KUBE_MINOR"
                if [ "$KUBE_MINOR" -ge 37 ] 2>/dev/null; then
                  echo "K8s >= 1.37: applying RBAC and settings configmap with secrets_access_namespaces"
                  kubectl apply -f ./test-cluster-yamls/basic-auth/rbac.yaml
                  kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-basic-auth.yaml
                else
                  echo "K8s < 1.37: skipping RBAC and settings configmap (cluster-wide secrets access is available)"
                fi

                # Wait for the basic-auth reference app to be ready
                kubectl rollout status deployment/basic-auth-ref-app -n basic-auth-test --timeout=120s

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-basic-auth-secret-update-crs.yaml
              scenario: basic-auth-secret-update
              displayName: "Run tests for basic auth secret update"
              summaryDisplayName: "Create TestKube Results Summary and cleanup basic-auth resources"
              setupScript: |
                # Update the secret username to newadmin
                kubectl patch secret basic-auth-creds -n basic-auth-test \
                  -p "{\"data\":{\"username\":\"$(echo -n newadmin | base64)\"}}"
                echo "Patched basic-auth-creds secret: username=newadmin"

                # Wait for the target allocator to pick up the secret change
                echo "Waiting 120s for config reload..."
                sleep 120
              afterSummaryScript: |
                # Clean up basic-auth test resources
                kubectl delete namespace basic-auth-test --ignore-not-found

                # Restore original settings configmap if it was changed (>= 1.37)
                KUBE_MINOR=$(kubectl version -o json | jq -r '.serverVersion.minor' | tr -d '+')
                if [ "$KUBE_MINOR" -ge 37 ] 2>/dev/null; then
                  kubectl apply -f $(Build.SourcesDirectory)/otelcollector/test/test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml
                fi

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-basic-auth-smon-v2-crs.yaml
              scenario: basic-auth-smon-v2
              displayName: "Run tests for basic auth ServiceMonitor (v2 configmap)"
              setupScript: |
                # Re-deploy basic-auth test resources for v2 test
                kubectl apply -f ./test-cluster-yamls/basic-auth/namespace.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/secret.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/deployment.yaml
                kubectl apply -f ./test-cluster-yamls/basic-auth/servicemonitor.yaml

                # Apply v2 configmap (contains secrets_access_namespaces for >= 1.37)
                KUBE_MINOR=$(kubectl version -o json | jq -r '.serverVersion.minor' | tr -d '+')
                echo "Kubernetes minor version: $KUBE_MINOR"
                if [ "$KUBE_MINOR" -ge 37 ] 2>/dev/null; then
                  echo "K8s >= 1.37: applying RBAC and v2 settings configmap with secrets_access_namespaces"
                  kubectl apply -f ./test-cluster-yamls/basic-auth/rbac.yaml
                  kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-basic-auth-v2.yaml
                else
                  echo "K8s < 1.37: applying v2 settings configmap (cluster-wide secrets access is available)"
                  kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-basic-auth-v2.yaml
                fi

                # Wait for the basic-auth reference app to be ready
                kubectl rollout status deployment/basic-auth-ref-app -n basic-auth-test --timeout=120s

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-basic-auth-secret-update-v2-crs.yaml
              scenario: basic-auth-secret-update-v2
              displayName: "Run tests for basic auth secret update (v2 configmap)"
              summaryDisplayName: "Create TestKube Results Summary and cleanup basic-auth v2 resources"
              setupScript: |
                # Update the secret username to newadmin
                kubectl patch secret basic-auth-creds -n basic-auth-test \
                  -p "{\"data\":{\"username\":\"$(echo -n newadmin | base64)\"}}"
                echo "Patched basic-auth-creds secret: username=newadmin"

                # Wait for the target allocator to pick up the secret change
                echo "Waiting 120s for config reload..."
                sleep 120
              afterSummaryScript: |
                # Clean up basic-auth test resources
                kubectl delete namespace basic-auth-test --ignore-not-found

                # Restore original settings configmap
                kubectl apply -f $(Build.SourcesDirectory)/otelcollector/test/test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-settings-error-crs.yaml
              scenario: settings-error
              displayName: "Run tests for errorprone settings configmap"
              setupScript: |
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-windows-configmap.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-error.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-custom-configmap-error-crs.yaml
              scenario: custom-configmap-error
              displayName: "Run tests for errorprone custom configmap"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-defaults-targets-turned-on.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/custom-config-map/ama-metrics-prometheus-config-configmap-with-error.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/custom-config-map-node/ama-metrics-prometheus-config-node-configmap-errors.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/custom-config-map-win/ama-metrics-prometheus-config-node-windows-configmap-errors.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-global-ext-labels-error-crs.yaml
              scenario: global-ext-labels-error
              displayName: "Run tests for errorprone global ext labels"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-defaults-targets-turned-on.yaml
                kubectl apply -f ./test-cluster-yamls/configmaps/global-settings/ama-metrics-prometheus-config-configmap-with-global-error.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-controlplane-istio-crs.yaml
              scenario: controlplane-istio
              displayName: "Run tests for controlplane-istio with custom interval and regex"
              summaryDisplayName: "Create TestKube Results Summary and cleanup controlplane-istio env"
              setupScript: |
                # Clean up any leftover custom Prometheus configmaps from previous runs/tests
                kubectl delete configmap ama-metrics-prometheus-config -n kube-system --ignore-not-found
                kubectl delete configmap ama-metrics-prometheus-config-node -n kube-system --ignore-not-found
                kubectl delete configmap ama-metrics-prometheus-config-node-windows -n kube-system --ignore-not-found

                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-controlplane-istio-enabled.yaml

                # Inject fake MESH_MEMBER_METRICS_FQDN so the config merger includes the controlplane-istio job.
                # The test only validates config generation via /api/v1/status/config, not actual scraping.
                kubectl set env deployment/ama-metrics -n kube-system MESH_MEMBER_METRICS_FQDN="https://fake-istiod.example.com"
                kubectl set env deployment/ama-metrics-operator-targets -n kube-system MESH_MEMBER_METRICS_FQDN="https://fake-istiod.example.com"

                # The controlplane_istio.yml template references /var/run/secrets/ama-metrics/token for auth.
                # This projected volume is only mounted when the Helm value endpointFQDN is set (production).
                # For CI testing, patch both deployments to add the projected volume + mount so the
                # promconfigvalidator doesn't reject the config due to missing credentials_file.
                kubectl patch deployment ama-metrics -n kube-system --type=json -p='[
                  {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"mcp-metrics-ama-metrics-token","projected":{"defaultMode":420,"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3600,"audience":"https://fake-istiod.example.com:443"}}]}}},
                  {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"mcp-metrics-ama-metrics-token","mountPath":"/var/run/secrets/ama-metrics","readOnly":true}}
                ]'
                kubectl patch deployment ama-metrics-operator-targets -n kube-system --type=json -p='[
                  {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"mcp-metrics-ama-metrics-token","projected":{"defaultMode":420,"sources":[{"serviceAccountToken":{"path":"token","expirationSeconds":3600,"audience":"https://fake-istiod.example.com:443"}}]}}},
                  {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"mcp-metrics-ama-metrics-token","mountPath":"/var/run/secrets/ama-metrics","readOnly":true}},
                  {"op":"add","path":"/spec/template/spec/containers/1/volumeMounts/-","value":{"name":"mcp-metrics-ama-metrics-token","mountPath":"/var/run/secrets/ama-metrics","readOnly":true}}
                ]'

                kubectl rollout status deployment/ama-metrics -n kube-system --timeout=300s
                kubectl rollout status deployment/ama-metrics-operator-targets -n kube-system --timeout=300s
              beforeSummaryScript: |
                # Clean up the fake MESH_MEMBER_METRICS_FQDN env var and projected volume for subsequent tests
                kubectl set env deployment/ama-metrics -n kube-system MESH_MEMBER_METRICS_FQDN-
                kubectl set env deployment/ama-metrics-operator-targets -n kube-system MESH_MEMBER_METRICS_FQDN-

                # Remove the projected volume and mounts added for controlplane-istio testing.
                # Use strategic merge patch to remove the volume by name; the rollout will recreate pods without it.
                # For volumes, we need to filter out mcp-metrics-ama-metrics-token.
                # Simplest approach: just let the rollout with removed env var recreate clean pods.
                # The volume patches are tied to the deployment spec and will persist, but they're harmless
                # (projected SA tokens are always valid). The env var removal is what matters for disabling the feature.

                kubectl rollout status deployment/ama-metrics -n kube-system --timeout=300s
                kubectl rollout status deployment/ama-metrics-operator-targets -n kube-system --timeout=300s

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-default-targets-on-v2-crs.yaml
              scenario: default-targets-on-v2
              displayName: "Run tests for all default targets in settings cfg map enabled (v2)"
              setupScript: |
                # Remove any leftover custom Prometheus configmaps first
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-configmap.yaml
                kubectl delete -f ./test-cluster-yamls/configmaps/ama-metrics-prometheus-config-node-windows-configmap.yaml

                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-defaults-targets-turned-on-v2.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-mip-false-crs.yaml
              scenario: mip-false
              displayName: "Run tests for minimal ingestion profile false"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/controlplane/ama-metrics-settings-configmap-mipfalse-emptykeep.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-deny-fs-access-crs.yaml
              scenario: deny-fs-access
              displayName: "Run tests for deny_fs_access_through_sms"
              setupScript: |
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-deny-fs-access.yaml

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-partial-no-pcs-v1-crs.yaml
              scenario: partial-no-pcs-v1
              displayName: "Run tests for partial v1 configmap (no prometheus-collector-settings)"
              summaryDisplayName: "Create TestKube Results Summary (partial v1)"
              setupScript: |
                # Delete the existing settings configmap first so the partial fixture is applied
                # cleanly without leaving a stale prometheus-collector-settings key behind.
                kubectl delete configmap ama-metrics-settings-configmap -n kube-system --ignore-not-found
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-partial-no-pcs-v1.yaml

                # Force a clean re-parse of the partial configmap on startup.
                kubectl rollout restart deployment/ama-metrics -n kube-system
                kubectl rollout status deployment/ama-metrics -n kube-system --timeout=300s

          - template: azure-template-config-test-case.yml
            parameters:
              AMW_QUERY_ENDPOINT: ${{ parameters.AMW_QUERY_ENDPOINT }}
              AZURE_CLIENT_ID: ${{ parameters.AZURE_CLIENT_ID }}
              branch: ${{ parameters.branch }}
              workflowFile: testkube-config-test-partial-no-pcs-v2-crs.yaml
              scenario: partial-no-pcs-v2
              displayName: "Run tests for partial v2 configmap (no prometheus-collector-settings)"
              summaryDisplayName: "Create TestKube Results Summary and restore default settings configmap"
              setupScript: |
                # Delete the existing settings configmap first so the partial fixture is applied
                # cleanly without leaving a stale prometheus-collector-settings key behind.
                kubectl delete configmap ama-metrics-settings-configmap -n kube-system --ignore-not-found
                kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-partial-no-pcs-v2.yaml

                # Force a clean re-parse of the partial configmap on startup.
                kubectl rollout restart deployment/ama-metrics -n kube-system
                kubectl rollout status deployment/ama-metrics -n kube-system --timeout=300s
              afterSummaryScript: |
                # Restore the default settings configmap for subsequent runs.
                kubectl apply -f ./test-cluster-yamls/configmaps/ama-metrics-settings-configmap.yaml

          - bash: |
              set -euo pipefail
              umask 077
              snapshot="$(mktemp -d "$(Agent.TempDirectory)/customer-settings.XXXXXX")"
              configmaps=(ama-metrics-settings-configmap ama-metrics-prometheus-config ama-metrics-prometheus-config-node ama-metrics-prometheus-config-node-windows)
              for ns in ama-settings-included ama-settings-excluded; do
                existing="$(kubectl get namespace "$ns" --ignore-not-found -o name)"
                if [[ -n "$existing" ]]; then
                  echo "Refusing to overwrite existing namespace $ns" >&2
                  exit 1
                fi
              done
              for cm in "${configmaps[@]}"; do
                kubectl get configmap "$cm" -n kube-system --ignore-not-found -o json \
                  | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration")' \
                  > "$snapshot/$cm.json"
              done
              restore() {
                local failed=0
                kubectl delete -f ./scenarios/settings/annotation-targets.yaml --ignore-not-found || failed=1
                for cm in "${configmaps[@]}"; do
                  if [[ -s "$snapshot/$cm.json" ]]; then
                    kubectl apply -f "$snapshot/$cm.json" || failed=1
                    cmp -s <(jq -S '{data,binaryData}' "$snapshot/$cm.json") \
                      <(kubectl get configmap "$cm" -n kube-system -o json | jq -S '{data,binaryData}') || failed=1
                  else
                    kubectl delete configmap "$cm" -n kube-system --ignore-not-found || failed=1
                    remaining="$(kubectl get configmap "$cm" -n kube-system --ignore-not-found -o name)" || failed=1
                    [[ -z "$remaining" ]] || failed=1
                  fi
                done
                if [[ "$failed" == 0 ]]; then
                  for cm in "${configmaps[@]}"; do rm -f -- "$snapshot/$cm.json"; done
                  rmdir "$snapshot"
                else
                  echo "Customer settings cleanup failed; snapshots retained in $snapshot" >&2
                fi
                return "$failed"
              }
              trap 'rc=$?; trap - EXIT; restore || rc=1; exit "$rc"' EXIT
              trap 'exit 130' INT
              trap 'exit 143' TERM
              kubectl apply -f ./scenarios/settings/annotation-targets.yaml
              for cm in "${configmaps[@]}"; do
                kubectl delete configmap "$cm" -n kube-system --ignore-not-found
              done
              export BUILD_ARTIFACTSTAGINGDIRECTORY="$(Build.ArtifactStagingDirectory)"
              export BUILD_BUILDID="$(Build.BuildId)"
              export SYSTEM_JOBID="$(System.JobId)"
              export SYSTEM_TASKINSTANCEID="$(System.TaskInstanceId)"
              failed=0
              for version in v1 v2; do
                kubectl apply -f "./scenarios/settings/customer-settings-$version/settings.yaml"
                if bash ./testkube/run-testkube-workflow.sh \
                  "${{ parameters.AMW_QUERY_ENDPOINT }}" \
                  "${{ parameters.AZURE_CLIENT_ID }}" \
                  "testkube-config-test-customer-settings-$version-crs.yaml" \
                  "testkube-config-test-customer-settings-$version-crs.yaml" \
                  false 480 ConfigTests "${{ parameters.branch }}"; then
                  echo "Customer settings $version passed"
                else
                  failed=1
                fi
                jq --arg environment "customer-settings-$version" '.environment=$environment' \
                  "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json" \
                  > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-customer-settings-$version.json"
                rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"
              done
              exit "$failed"
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Run customer ConfigMap alias and annotation scenarios (v1 and v2)"
            continueOnError: true

          - bash: |
              set -euo pipefail
              kubectl apply -f ./test-cluster-yamls/configmaps/default-config-map/ama-metrics-settings-configmap-dcgm.yaml
              export BUILD_ARTIFACTSTAGINGDIRECTORY="$(Build.ArtifactStagingDirectory)"
              bash ./testkube/run-testkube-workflow.sh \
                "${{ parameters.AMW_QUERY_ENDPOINT }}" \
                "${{ parameters.AZURE_CLIENT_ID }}" \
                "testkube-config-test-dcgm-crs.yaml" \
                "testkube-config-test-dcgm-crs.yaml" false 480 ConfigTests \
                "${{ parameters.branch }}"
            workingDirectory: $(Build.SourcesDirectory)/otelcollector/test
            displayName: "Run DCGM custom interval and keep-list configuration assertions"
            continueOnError: true

          - bash: |
              set -euo pipefail
              jq '.environment="dcgm-custom"' "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json" \
                > "$(Build.ArtifactStagingDirectory)/testkube-results/testkube-results-dcgm-custom.json"
              rm -f "$(Build.ArtifactStagingDirectory)/testkube-results-ConfigTests.json"
            displayName: "Save DCGM TestKube result"
            condition: always()

          # List created files
          - bash: |
              echo "Results files created:"
              ls -la "$(Build.ArtifactStagingDirectory)/testkube-results/"
            displayName: "List Results Files"

          - bash: |
              export SYSTEM_PULLREQUEST_PULLREQUESTTITLE="$(System.PullRequest.PullRequestTitle)"
              export SYSTEM_PULLREQUEST_PULLREQUESTNUMBER="$(System.PullRequest.PullRequestNumber)"
              export BUILD_REASON="$(Build.Reason)"
              export BUILD_SOURCEVERSIONMESSAGE="$(Build.SourceVersionMessage)"
              export BUILD_SOURCEBRANCHNAME="$(Build.SourceBranchName)"
              export BUILD_BUILDNUMBER="$(Build.BuildNumber)"
              export SYSTEM_COLLECTIONURI="$(System.CollectionUri)"
              export SYSTEM_TEAMPROJECT="$(System.TeamProject)"
              export BUILD_BUILDID="$(Build.BuildId)"
              chmod +x ./otelcollector/test/testkube/send-testkube-summary.sh
              ./otelcollector/test/testkube/send-testkube-summary.sh "$TEAMS_WEBHOOK_URL" "$(Build.ArtifactStagingDirectory)/testkube-results"
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Send TestKube Summary Notification"
            env:
              TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
            condition: always()

          - bash: |
              set -euo pipefail
              python3 ./otelcollector/test/testkube/workflow_evidence.py gate \
                "$(Build.ArtifactStagingDirectory)/testkube-results" \
                no-configmaps all-targets-disabled default-targets-on \
                all-rs-targets-enabled all-ds-targets-enabled all-targets-enabled \
                only-custom-configmap global-settings custom-node-configmap \
                basic-auth-smon basic-auth-secret-update basic-auth-smon-v2 basic-auth-secret-update-v2 \
                settings-error custom-configmap-error global-ext-labels-error controlplane-istio \
                default-targets-on-v2 mip-false deny-fs-access partial-no-pcs-v1 partial-no-pcs-v2 \
                customer-settings-v1 customer-settings-v2 dcgm-custom
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Require every ConfigTests scenario and retained execution evidence to pass"
            condition: always()

          - task: PublishTestResults@2
            displayName: "Publish TestKube Ginkgo JUnit"
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/testkube-executions/**/junit.xml'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              testRunTitle: ConfigTests

          - task: PublishPipelineArtifact@1
            displayName: "Retain TestKube submissions, executions and reports"
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: configtests-evidence

- stage: CandidateCapacity
  displayName: Regional admission and hard producer-evidence preflight
  condition: and(not(canceled()), or(eq('${{ parameters.candidateMode }}', 'True'), eq(variables['Build.Reason'], 'ResourceTrigger'), and(eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/sre/vuln/'), contains(variables['System.PullRequest.SourceBranch'], '/ama-metrics-sre-')))))
  jobs:
  - job: Capacity
    timeoutInMinutes: 240
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    variables:
      capacityRoot: $(Agent.TempDirectory)/candidate-capacity-source-$(Build.BuildId)
      capacityEvidence: $(Build.ArtifactStagingDirectory)/candidate-capacity-$(Build.BuildId)
      capacityPython: $(Agent.TempDirectory)/candidate-capacity-python-$(Build.BuildId)
      producerEvidence: $(Agent.TempDirectory)/candidate-producer-evidence-$(Build.BuildId)
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - bash: |
        set -euo pipefail
        sha="$CANDIDATE_SOURCE_SHA"
        producer="$PRODUCER_BUILD_ID"
        if [[ "$BUILD_REASON" == PullRequest ]]; then
          [[ "$PR_SOURCE_BRANCH" =~ ^refs/heads/(sre/vuln/[A-Za-z0-9][A-Za-z0-9._-]*|[^/]+/ama-metrics-sre-[^/]+)$ ]] || exit 1
          sha="$PR_SOURCE_COMMIT"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "PR head is missing" >&2; exit 1; }
          producer=""
          for attempt in $(seq 1 180); do
            resolved="$(python3 "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
              --resolve-producer --source-commit "$sha" --source-branch "$PR_SOURCE_BRANCH")"
            producer="$(printf '%s' "$resolved" | python3 -c 'import json,sys; print(json.load(sys.stdin)["buildId"] or "")')"
            [[ -z "$producer" ]] || break
            sleep 60
          done
        fi
        [[ "$sha" =~ ^[0-9a-f]{40}$ && "$producer" =~ ^[1-9][0-9]*$ && ! -e "$CAPACITY_ROOT" ]] || { echo "Campaign admission requires a producer and new exact-source checkout" >&2; exit 1; }
        git fetch --no-tags origin "$sha"
        git worktree add --detach "$CAPACITY_ROOT" "$sha"
        [[ "$(git -C "$CAPACITY_ROOT" rev-parse HEAD)" == "$sha" && -z "$(git -C "$CAPACITY_ROOT" status --porcelain)" ]]
        echo "##vso[task.setvariable variable=capacitySourceSha]$sha"
        echo "##vso[task.setvariable variable=capacityProducerBuildId]$producer"
        # Also applies to apt invocations inside the Azure CLI installer.
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99ama-metrics-lock-timeout >/dev/null
        command -v az || curl --fail --silent --show-error --location --retry 3 https://aka.ms/InstallAzureCLIDeb | sudo bash
        az bicep install
        sudo install -m 0755 "${AZURE_CONFIG_DIR:-$HOME/.azure}/bin/bicep" /usr/local/bin/bicep
        echo "##vso[task.setvariable variable=AZURE_BICEP_USE_BINARY_FROM_PATH]true"
        python3 -m venv "$CAPACITY_PYTHON"
        "$CAPACITY_PYTHON/bin/python" -m pip install -r "$BUILD_SOURCESDIRECTORY/otelcollector/test/scenarios/clusters/requirements.txt"
      displayName: Prepare exact-source read-only admission tools
      env:
        BUILD_REASON: $(Build.Reason)
        PR_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
        PR_SOURCE_COMMIT: $(System.PullRequest.SourceCommitId)
        CANDIDATE_SOURCE_SHA: $(campaignSourceSha)
        PRODUCER_BUILD_ID: $(campaignProducerBuildId)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        CAPACITY_ROOT: $(capacityRoot)
        CAPACITY_PYTHON: $(capacityPython)
    - task: AzureCLI@2
      name: admit
      displayName: Verify source-bound placements and retained fixtures before provisioning
      inputs:
        azureSubscription: ${{ parameters.subscriptionName }}(${{ parameters.subscriptionID }})
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb ]] || { echo "Campaign admission requires the approved build subscription" >&2; exit 1; }
          [[ "$(git -C "$CAPACITY_ROOT" rev-parse HEAD)" == "$CANDIDATE_SOURCE_SHA" ]]
          [[ "$TEST_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git -C "$BUILD_SOURCESDIRECTORY" rev-parse HEAD)" == "$TEST_SOURCE_SHA" ]] || { echo "Admission test source does not match this pipeline revision" >&2; exit 1; }
          "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/otelcollector/test/scenarios/run-scenario.py" campaign-preflight \
            --source-root "$CAPACITY_ROOT" --scenario "$CANDIDATE_SCENARIO" \
            --test-source-root "$BUILD_SOURCESDIRECTORY" --test-source-sha "$TEST_SOURCE_SHA" \
            --build-id "$PRODUCER_BUILD_ID" --evidence "$CAPACITY_EVIDENCE"
          "$PYTHON" - "$CAPACITY_EVIDENCE/campaign-preflight.json" <<'PY'
          import json, os, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = os.environ["CANDIDATE_SCENARIO"]
          scenarios = "default,acns,otlp,acns-cilium,operator-secret-watch,proxy-custom-ca,ampls-proxy,ampls,proxy".split(",")
          selected = (scenarios if expected == "all" else
                      ["default", "acns", "otlp"]
                      if expected == "four-lane" else [expected])
          if (value.get("status") != "PASS" or value.get("sourceSha") != os.environ["CANDIDATE_SOURCE_SHA"]
                  or value.get("testSourceSha") != os.environ["TEST_SOURCE_SHA"]
                  or value.get("buildId") != int(os.environ["PRODUCER_BUILD_ID"])
                  or set(value.get("placements", {})) != set(selected)
                  or set(value.get("existing", {})) != set(selected)
                  or any(type(value["existing"][name]) is not bool for name in selected)):
              raise ValueError("Campaign admission source/build/placement contract mismatch")
          for scenario, region in value["placements"].items():
              if region not in ("centralus", "eastus2", "westcentralus") or region not in value.get("regions", {}):
                  raise ValueError("Campaign admission has no approved regional proof")
          for scenario, region in value["placements"].items():
              key = scenario.replace("-", "_")
              print(f"##vso[task.setvariable variable=location_{key};isOutput=true]{region}")
              print(f"##vso[task.setvariable variable=existing_{key};isOutput=true]{str(value['existing'][scenario]).lower()}")
          print(f"##vso[task.setvariable variable=sourceSha;isOutput=true]{value['sourceSha']}")
          print(f"##vso[task.setvariable variable=testSourceSha;isOutput=true]{value['testSourceSha']}")
          print(f"##vso[task.setvariable variable=producerBuildId;isOutput=true]{os.environ['PRODUCER_BUILD_ID']}")
          print(f"##vso[task.setvariable variable=validationBuildId;isOutput=true]{os.environ['BUILD_BUILDID']}")
          PY
      env:
        CAPACITY_ROOT: $(capacityRoot)
        CAPACITY_EVIDENCE: $(capacityEvidence)
        CANDIDATE_SOURCE_SHA: $(capacitySourceSha)
        TEST_SOURCE_SHA: $(Build.SourceVersion)
        PRODUCER_BUILD_ID: $(capacityProducerBuildId)
        CANDIDATE_SCENARIO: ${{ parameters.candidateScenario }}
        PYTHON: $(capacityPython)/bin/python
    - bash: |
        set -euo pipefail
        [[ ! -e "$PRODUCER_EVIDENCE" ]] || { echo "Producer evidence path must be new" >&2; exit 1; }
        mkdir -p "$PRODUCER_EVIDENCE"
        fetched="$("$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
          --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
          --output "$PRODUCER_EVIDENCE/verified")"
        printf '%s\n' "$fetched" > "$PRODUCER_EVIDENCE/fetch.json"
        PYTHONPATH="$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e" "$PYTHON" -B - \
          "$PRODUCER_EVIDENCE/verified" "$PRODUCER_BUILD_ID" "$CANDIDATE_SOURCE_SHA" <<'PY'
        import sys
        from pathlib import Path
        import fetch_candidate

        root = Path(sys.argv[1])
        receipt = fetch_candidate.load_verified(root, int(sys.argv[2]), sys.argv[3])
        fetch_candidate.validate_scan_artifact(
            root / fetch_candidate.SCAN_ARTIFACT, receipt, require_database=True)
        print("Exact-source producer receipts, scan log, full findings and frozen DB verified.")
        PY
      displayName: Verify exact producer receipts and frozen scan database before admitting lanes
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        PRODUCER_BUILD_ID: $(capacityProducerBuildId)
        CANDIDATE_SOURCE_SHA: $(capacitySourceSha)
        PRODUCER_EVIDENCE: $(producerEvidence)
        PYTHON: $(capacityPython)/bin/python
    - bash: |
        set -euo pipefail
        mkdir -p "$CAPACITY_EVIDENCE"
        printf 'Job status: %s\nThis diagnostic is not campaign admission proof; require the source-bound campaign-preflight.json PASS.\n' \
          "$AGENT_JOBSTATUS" > "$CAPACITY_EVIDENCE/job-status.txt"
      displayName: Retain admission job diagnostic even when setup fails
      condition: always()
      env:
        CAPACITY_EVIDENCE: $(capacityEvidence)
    - task: PublishPipelineArtifact@1
      displayName: Retain source-bound campaign admission
      condition: always()
      inputs:
        targetPath: $(capacityEvidence)
        artifact: candidate-capacity-$(Build.BuildId)

- stage: CandidateScan
  displayName: Compare exact producer scan and gate approval
  dependsOn:
  - CandidateCapacity
  condition: and(not(canceled()), eq(dependencies.CandidateCapacity.result, 'Succeeded'))
  variables:
    candidateScanSourceSha: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.sourceSha'] ]
    candidateScanProducerBuildId: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.producerBuildId'] ]
  jobs:
  - job: Scan
    timeoutInMinutes: 240
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    variables:
      candidateScanEvidence: $(Agent.TempDirectory)/candidate-scan-$(Build.BuildId)
      candidateScanTools: $(Agent.TempDirectory)/candidate-scan-tools-$(Build.BuildId)
      candidateScanPublication: $(Build.ArtifactStagingDirectory)/candidate-scan-$(Build.BuildId)
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - bash: |
        set -euo pipefail
        [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$PRODUCER_BUILD_ID" =~ ^[1-9][0-9]*$ ]] || {
          echo "Scan requires exact admitted source and producer" >&2; exit 1;
        }
        git fetch --no-tags origin "$CANDIDATE_SOURCE_SHA"
        git cat-file -e "$CANDIDATE_SOURCE_SHA^{commit}"
        [[ ! -e "$SCAN_EVIDENCE" && ! -e "$SCAN_TOOLS" ]] || { echo "Candidate scan paths must be new" >&2; exit 1; }
        mkdir -p "$SCAN_EVIDENCE" "$SCAN_TOOLS"
        fetched="$("$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
          --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
          --output "$SCAN_EVIDENCE/verified")"
        version="$(printf '%s' "$fetched" | "$PYTHON" -c 'import json,sys; print(json.load(sys.stdin)["trivyVersion"])')"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid producer Trivy version" >&2; exit 1; }
        cd "$SCAN_TOOLS"
        archive="trivy_${version}_Linux-64bit.tar.gz"
        checksums="trivy_${version}_checksums.txt"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}" -o "$archive"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/aquasecurity/trivy/releases/download/v${version}/${checksums}" -o "$checksums"
        checksum="$(grep -E "[[:space:]]${archive}$" "$checksums" || true)"
        [[ -n "$checksum" ]] || { echo "Trivy release checksum is missing" >&2; exit 1; }
        printf '%s\n' "$checksum" | sha256sum --check
        tar -xzf "$archive" trivy
        rm "$archive" "$checksums"
        chmod +x trivy
        installed="$("$SCAN_TOOLS/trivy" --version --format json | "$PYTHON" -c 'import json,sys; print(json.load(sys.stdin)["Version"])')"
        [[ "$installed" == "$version" ]] || { echo "Installed Trivy version does not match producer scan" >&2; exit 1; }
        PATH="$SCAN_TOOLS:$PATH" "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/scan_candidate.py" \
          --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
          --baseline-image 'mcr.microsoft.com/azuremonitor/containerinsights/ciprod/prometheus-collector/images@sha256:195b238b026fcf7cfef5fddf66d4ea8b305ad093d99171b3079089a665030324' \
          --platform linux/amd64 \
          --verified-candidate "$SCAN_EVIDENCE/verified" --output "$SCAN_EVIDENCE/scans"
      displayName: Compare receipt-bound candidate and baseline with a fresh shared Trivy DB
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        PRODUCER_BUILD_ID: $(candidateScanProducerBuildId)
        CANDIDATE_SOURCE_SHA: $(candidateScanSourceSha)
        PYTHON: python3
        SCAN_EVIDENCE: $(candidateScanEvidence)
        SCAN_TOOLS: $(candidateScanTools)
    - bash: |
        set -euo pipefail
        mkdir -p "$SCAN_EVIDENCE/publication-input"
        if [[ -d "$SCAN_EVIDENCE/verified" ]]; then
          mkdir -p "$SCAN_EVIDENCE/publication-input/pipeline-verification"
          cp -a "$SCAN_EVIDENCE/verified/." "$SCAN_EVIDENCE/publication-input/pipeline-verification/"
        fi
        if [[ -d "$SCAN_EVIDENCE/scans" ]]; then
          cp -a "$SCAN_EVIDENCE/scans" "$SCAN_EVIDENCE/publication-input/"
        fi
        printf 'Candidate scan job status: %s\n' "$AGENT_JOBSTATUS" \
          > "$SCAN_EVIDENCE/publication-input/scan-status.txt"
        if [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$PRODUCER_BUILD_ID" =~ ^[1-9][0-9]*$ ]]; then
          "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/candidate_evidence.py" \
            --evidence "$SCAN_EVIDENCE/publication-input" --output "$SCAN_PUBLICATION" \
            --source-sha "$CANDIDATE_SOURCE_SHA" --producer-build-id "$PRODUCER_BUILD_ID"
        else
          mkdir -p "$SCAN_PUBLICATION"
          cp "$SCAN_EVIDENCE/publication-input/scan-status.txt" "$SCAN_PUBLICATION/"
        fi
      displayName: Always stage filtered one-time candidate scan evidence
      condition: always()
      env:
        PRODUCER_BUILD_ID: $(candidateScanProducerBuildId)
        CANDIDATE_SOURCE_SHA: $(candidateScanSourceSha)
        SCAN_EVIDENCE: $(candidateScanEvidence)
        SCAN_PUBLICATION: $(candidateScanPublication)
        PYTHON: python3
    - task: PublishPipelineArtifact@1
      displayName: Retain one filtered candidate vulnerability comparison
      condition: always()
      inputs:
        targetPath: $(candidateScanPublication)
        artifact: candidate-scan-$(Build.BuildId)

- ${{ each scenario in split('default,acns,otlp,acns-cilium,operator-secret-watch,proxy-custom-ca,ampls-proxy,ampls,proxy', ',') }}:
  - ${{ if or(eq(parameters.candidateScenario, 'all'), eq(parameters.candidateScenario, scenario), and(eq(parameters.candidateScenario, 'four-lane'), in(scenario, 'default', 'acns', 'otlp'))) }}:
    - stage: Candidate_${{ replace(scenario, '-', '_') }}
      displayName: Candidate ${{ scenario }}
      lockBehavior: sequential
      dependsOn:
      - CandidateCapacity
      condition: and(not(canceled()), eq(dependencies.CandidateCapacity.result, 'Succeeded'))
      variables:
        candidateLocation: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.location_${{ replace(scenario, '-', '_') }}'] ]
        candidateExisting: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.existing_${{ replace(scenario, '-', '_') }}'] ]
        candidateCapacitySourceSha: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.sourceSha'] ]
        candidateCapacityTestSourceSha: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.testSourceSha'] ]
        candidateCapacityBuildId: $[ stageDependencies.CandidateCapacity.Capacity.outputs['admit.validationBuildId'] ]
      jobs:
      - deployment: CandidateTestkube
        displayName: Test receipt-bound candidate ${{ scenario }}
        environment: Prometheus-Collector-Tests
        timeoutInMinutes: 1680
        cancelTimeoutInMinutes: 60
        variables:
          candidateAttempt: $(Build.BuildId)-${{ scenario }}-$(System.StageAttempt)-$(System.JobAttempt)
          candidateRoot: $(Agent.TempDirectory)/candidate-$(candidateAttempt)
          candidateEvidence: $(Agent.TempDirectory)/candidate-evidence-$(candidateAttempt)
          candidateTools: $(Agent.TempDirectory)/candidate-tools-$(candidateAttempt)
          candidatePython: $(Agent.TempDirectory)/candidate-python-$(candidateAttempt)
          candidatePublication: $(Build.ArtifactStagingDirectory)/candidate-$(candidateAttempt)
        pool:
          name: Azure-Pipelines-CI-Test-EO
          image: ci-1es-managed-ubuntu-2204
          os: linux
        strategy:
          runOnce:
            deploy:
              steps:
              - template: azure-template-candidate-config-tests.yml
                parameters:
                  producerBuildId: $(campaignProducerBuildId)
                  sourceSha: $(campaignSourceSha)
                  scenario: ${{ scenario }}
                  azureSubscription: ${{ parameters.subscriptionName }}(${{ parameters.subscriptionID }})
