parameters:
- name: folderPath
  type: string
- name: displayName
  type: string

steps:
- task: EsrpCodeSigning@6
  inputs:
    ConnectedServiceName: 'ESRPServiceConnectionPrometheus'
    UseMSIAuthentication: true
    AppRegistrationClientId: 'bf21d5fe-78bd-45d2-b04d-c61f2e090c9a'
    AppRegistrationTenantId: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'
    EsrpClientId: "73f8d5f9-b507-497f-b698-4ed00fcba5a3"
    AuthAKVName: 'ESRPPrometheusKVProd'
    AuthCertName: 'ESRPContainerImageSignCert'
    AuthSignCertName: 'ESRPReqPrometheusProdCert'
    FolderPath: ${{ parameters.folderPath }}
    Pattern: '*.dll,*.exe,*.so'
    signConfigType: 'inlineSignParams'
    inlineOperation: |
      [
              {
                  "KeyCode" : "CP-231522",
                  "OperationCode" : "SigntoolSign",
                  "Parameters" : {
                      "OpusName" : "Microsoft",
                      "OpusInfo" : "http://www.microsoft.com",
                      "Append" : "/as",
                      "FileDigest" : "/fd \"SHA256\"",
                      "PageHash" : "/NPH",
                      "TimeStamp" : "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                  },
                  "ToolName" : "sign",
                  "ToolVersion" : "1.0"
              },
              {
                  "KeyCode" : "CP-231522",
                  "OperationCode" : "SigntoolVerify",
                  "Parameters" : {},
                  "ToolName" : "sign",
                  "ToolVersion" : "1.0"
              }
          ]
    SessionTimeout: '60'
    MaxConcurrency: '50'
    MaxRetryAttempts: '5'
  displayName: ${{ parameters.displayName }}
