parameters:
- name: producerBuildId
  type: string
- name: sourceSha
  type: string
- name: cve
  type: string
  default: ''
- name: azureSubscription
  type: string
- name: scenario
  type: string
  default: default
  values:
  - default
  - classic-azure-cni
  - acns
  - otlp

steps:
- checkout: self
  clean: true
  persistCredentials: true

- bash: |
    set -euo pipefail
    [[ "$BUILD_REASON" != PullRequest ]] || {
      [[ "$PR_SOURCE_BRANCH" =~ ^refs/heads/(sre/vuln/[A-Za-z0-9][A-Za-z0-9._-]*|[^/]+/ama-metrics-sre-[^/]+)$ ]] || {
        echo "PR source is not an allowed SRE campaign branch" >&2
        exit 1
      }
      [[ "$PR_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
        echo "PR source commit is not available" >&2
        exit 1
      }
      for attempt in $(seq 1 180); do
        resolved="$(python3 "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
          --resolve-producer --source-commit "$PR_SOURCE_COMMIT" --source-branch "$PR_SOURCE_BRANCH")"
        build_id="$(printf '%s' "$resolved" | python3 -c 'import json,sys; print(json.load(sys.stdin)["buildId"] or "")')"
        if [[ -n "$build_id" ]]; then
          echo "##vso[task.setvariable variable=campaignProducerBuildId]$build_id"
          echo "##vso[task.setvariable variable=campaignSourceSha]$PR_SOURCE_COMMIT"
          echo "Resolved successful producer $build_id for PR head $PR_SOURCE_COMMIT"
          exit 0
        fi
        echo "No successful pipeline 440 build for PR head $PR_SOURCE_COMMIT yet; waiting ($attempt/180)"
        sleep 60
      done
      echo "Timed out waiting for the exact-head pipeline 440 producer" >&2
      exit 1
    }
  displayName: "Resolve successful 440 producer for the exact PR head"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    BUILD_REASON: $(Build.Reason)
    PR_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
    PR_SOURCE_COMMIT: $(System.PullRequest.SourceCommitId)

- bash: |
    set -euo pipefail
    if [[ "$BUILD_REASON" == PullRequest ]]; then
      [[ "$PR_SOURCE_BRANCH" =~ ^refs/heads/(sre/vuln/[A-Za-z0-9][A-Za-z0-9._-]*|[^/]+/ama-metrics-sre-[^/]+)$ \
         && "$CANDIDATE_SOURCE_SHA" == "$PR_SOURCE_COMMIT" ]] || {
        echo "Candidate execution requires the resolved SRE PR head" >&2
        exit 1
      }
    fi
    [[ "$SYSTEM_JOBATTEMPT" =~ ^[1-9][0-9]*$ && "$SYSTEM_STAGEATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "Candidate attempt counters are invalid" >&2; exit 1; }
    [[ "$PRODUCER_BUILD_ID" =~ ^[1-9][0-9]*$ && "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Require positive producer build ID and full lowercase source SHA" >&2; exit 1; }
    [[ "$CAPACITY_SOURCE_SHA" == "$CANDIDATE_SOURCE_SHA" && "$CAPACITY_BUILD_ID" == "$BUILD_BUILDID" ]] || { echo "Missing or mismatched regional capacity admission" >&2; exit 1; }
    case "$CANDIDATE_SCENARIO" in default|classic-azure-cni|acns|otlp) ;; *) echo "Unsupported candidate scenario" >&2; exit 1 ;; esac
    [[ ! -e "$CANDIDATE_ROOT" && ! -e "$CANDIDATE_EVIDENCE" ]] || { echo "Candidate checkout and evidence must be new" >&2; exit 1; }
    git fetch --no-tags origin "$CANDIDATE_SOURCE_SHA"
    git cat-file -e "$CANDIDATE_SOURCE_SHA^{commit}"
    if [[ -z "$CANDIDATE_CVE" ]]; then
      git cat-file -e "$CANDIDATE_SOURCE_SHA:.pipelines/pr-e2e/campaign.json" || { echo "Campaign-selected CVE or campaign.json is required in candidate source" >&2; exit 1; }
      CANDIDATE_CVE="$(git show "$CANDIDATE_SOURCE_SHA:.pipelines/pr-e2e/campaign.json" | jq -er 'select(.schemaVersion == 1) | .cve | select(type == "string" and test("^CVE-[0-9]{4}-[0-9]+$"))')"
    fi
    [[ "$CANDIDATE_CVE" =~ ^CVE-[0-9]{4}-[0-9]+$ ]] || { echo "Require one campaign-selected CVE" >&2; exit 1; }
    echo "##vso[task.setvariable variable=candidateCve]$CANDIDATE_CVE"
    git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SOURCE_SHA"
    [[ "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" == "$CANDIDATE_SOURCE_SHA" ]]
    [[ -z "$(git -C "$CANDIDATE_ROOT" status --porcelain)" ]]
    for file in .pipelines/pr-e2e/fetch_candidate.py .pipelines/pr-e2e/scan_candidate.py; do
      [[ -f "$BUILD_SOURCESDIRECTORY/$file" ]] || { echo "Trusted pipeline checkout lacks $file" >&2; exit 1; }
    done
    python3 -B "$BUILD_SOURCESDIRECTORY/.pipelines/candidate_coverage.py" \
      --root "$CANDIDATE_ROOT/otelcollector/test/scenarios" --scenario "$CANDIDATE_SCENARIO" \
      --output "$CANDIDATE_EVIDENCE/coverage.json"
  displayName: "Validate opt-in inputs and prepare clean exact-source candidate"
  env:
    BUILD_REASON: $(Build.Reason)
    PR_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
    PR_SOURCE_COMMIT: $(System.PullRequest.SourceCommitId)
    PRODUCER_BUILD_ID: ${{ parameters.producerBuildId }}
    CANDIDATE_SOURCE_SHA: ${{ parameters.sourceSha }}
    CANDIDATE_CVE: ${{ parameters.cve }}
    CANDIDATE_SCENARIO: ${{ parameters.scenario }}
    CAPACITY_SOURCE_SHA: $(candidateCapacitySourceSha)
    CAPACITY_BUILD_ID: $(candidateCapacityBuildId)
    CANDIDATE_ROOT: $(candidateRoot)
    CANDIDATE_EVIDENCE: $(candidateEvidence)

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: "Select candidate harness Python"

- bash: |
    set -euo pipefail
    # The managed candidate image lacks unzip for HelmInstaller, and az/Bicep for AzureCLI tasks and the harness.
    echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99ama-metrics-lock-timeout >/dev/null
    sudo apt-get update
    sudo apt-get install -y --no-install-recommends unzip jq gettext-base libicu70
    command -v az || curl --fail --silent --show-error --location --retry 3 https://aka.ms/InstallAzureCLIDeb | sudo bash
    az bicep install
    # AzureCLI tasks use their own AZURE_CONFIG_DIR, so they can only find Bicep on PATH.
    sudo install -m 0755 "${AZURE_CONFIG_DIR:-$HOME/.azure}/bin/bicep" /usr/local/bin/bicep
    bicep --version
    echo "##vso[task.setvariable variable=AZURE_BICEP_USE_BINARY_FROM_PATH]true"
    if ! command -v kubectl; then
      curl --fail --silent --show-error --location --retry 3 \
        https://dl.k8s.io/release/v1.36.6/bin/linux/amd64/kubectl -o "$AGENT_TEMPDIRECTORY/kubectl"
      echo "29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634  $AGENT_TEMPDIRECTORY/kubectl" | sha256sum --check
      sudo install -m 0755 "$AGENT_TEMPDIRECTORY/kubectl" /usr/local/bin/kubectl
    fi
    for tool in unzip az kubectl jq envsubst; do command -v "$tool"; done
  displayName: "Install candidate host prerequisites"

- bash: |
    set -euo pipefail
    [[ ! -e "$PRODUCER_EVIDENCE" ]] || { echo "Producer evidence directory must be new" >&2; exit 1; }
    fetched="$(python3 "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
      --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
      --output "$PRODUCER_EVIDENCE")"
    trivy_version="$(printf '%s' "$fetched" | python3 -c 'import json,sys; print(json.load(sys.stdin)["trivyVersion"])')"
    [[ "$trivy_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid producer Trivy version" >&2; exit 1; }
    echo "##vso[task.setvariable variable=candidateTrivyVersion]$trivy_version"
    echo "Verified producer Trivy version $trivy_version"
  displayName: "Fetch exact producer evidence and Trivy version"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    PRODUCER_BUILD_ID: ${{ parameters.producerBuildId }}
    CANDIDATE_SOURCE_SHA: ${{ parameters.sourceSha }}
    PRODUCER_EVIDENCE: $(Agent.TempDirectory)/candidate-producer-$(candidateAttempt)

- task: HelmInstaller@1
  inputs:
    helmVersionToInstall: '3.19.0'
  displayName: "Install pinned harness Helm"

- bash: |
    set -euo pipefail
    python3 -m venv "$CANDIDATE_PYTHON"
    "$CANDIDATE_PYTHON/bin/python" -m pip install \
      -r "$BUILD_SOURCESDIRECTORY/otelcollector/test/scenarios/clusters/requirements.txt"
    mkdir "$CANDIDATE_TOOLS"
    cd "$CANDIDATE_TOOLS"
    curl --fail --silent --show-error --location --retry 3 \
      https://github.com/kubeshop/testkube/releases/download/2.15.0/testkube_2.15.0_Linux_x86_64.tar.gz -o testkube.tar.gz
    echo "8ec7af98d2b7c21a6f3e9f55c5bba49a59ab7f104a737e68fa5729158e37ce32  testkube.tar.gz" | sha256sum --check
    tar -xzf testkube.tar.gz kubectl-testkube
    rm testkube.tar.gz
    chmod +x kubectl-testkube
    version="$CANDIDATE_TRIVY_VERSION"
    [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid producer Trivy version" >&2; exit 1; }
    archive="trivy_${version}_Linux-64bit.tar.gz"
    checksums="trivy_${version}_checksums.txt"
    curl --fail --silent --show-error --location --retry 3 \
      "https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}" -o "$archive"
    curl --fail --silent --show-error --location --retry 3 \
      "https://github.com/aquasecurity/trivy/releases/download/v${version}/${checksums}" -o "$checksums"
    checksum="$(grep -E "[[:space:]]${archive}$" "$checksums" || true)"
    [[ -n "$checksum" ]] || { echo "Trivy release checksum is missing" >&2; exit 1; }
    printf '%s\n' "$checksum" | sha256sum --check
    tar -xzf "$archive" trivy
    rm "$archive" "$checksums"
    chmod +x trivy
    installed_version="$(./trivy --version --format json | "$CANDIDATE_PYTHON/bin/python" -c 'import json,sys; print(json.load(sys.stdin)["Version"])')"
    [[ "$installed_version" == "$version" ]] || { echo "Installed Trivy version does not match producer scan" >&2; exit 1; }
    echo "##vso[task.prependpath]$CANDIDATE_TOOLS"
    for tool in az kubectl helm bash jq envsubst; do command -v "$tool"; done
    ./kubectl-testkube run testworkflow --help > /dev/null
    az bicep version
    "$CANDIDATE_PYTHON/bin/python" -B \
      "$BUILD_SOURCESDIRECTORY/.pipelines/candidate_evidence_test.py" -v
    echo "##vso[task.setvariable variable=candidateScanPrerequisitesReady]true"
  workingDirectory: $(candidateRoot)
  displayName: "Prepare scoped pinned CLI and verify harness prerequisites"
  env:
    CANDIDATE_PYTHON: $(candidatePython)
    CANDIDATE_TOOLS: $(candidateTools)
    CANDIDATE_TRIVY_VERSION: $(candidateTrivyVersion)

- task: AzureCLI@2
  displayName: "Run authenticated candidate scenario through existing TestKube harness"
  timeoutInMinutes: 540
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      [[ "$(az account show --query id -o tsv)" == 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb ]] || { echo "Service connection must target the approved build subscription" >&2; exit 1; }
      [[ "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" == "$CANDIDATE_SOURCE_SHA" ]]
      [[ "$CANDIDATE_LOCATION" == centralus || "$CANDIDATE_LOCATION" == eastus2 || "$CANDIDATE_LOCATION" == westcentralus ]] || { echo "Regional capacity admission has no approved placement" >&2; exit 1; }
      case "$CANDIDATE_SCENARIO" in
        default|classic-azure-cni|acns|otlp) max_run_seconds=28800 ;;
        *) echo "Unsupported candidate scenario" >&2; exit 1 ;;
      esac
      CANDIDATE_RUN_ID="$("$PYTHON" -c 'import sys,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, "ama-metrics-candidate:" + sys.argv[1] + ":" + sys.argv[2]))' "$BUILD_BUILDID" "$CANDIDATE_SCENARIO")"
      retry_args=()
      if [[ "$SYSTEM_STAGEATTEMPT" -gt 1 || "$SYSTEM_JOBATTEMPT" -gt 1 ]]; then
        retry_args+=(--reuse-existing)
      fi
      publish_bootstrap() {
        local proof="$CANDIDATE_EVIDENCE/rbac-bootstrap.json"
        local public="$CANDIDATE_EVIDENCE/rbac-bootstrap-public.json"
        while true; do
          if [[ -f "$proof" ]] && jq -e \
            --arg buildId "$(Build.BuildId)" --arg sourceSha "$CANDIDATE_SOURCE_SHA" \
            --arg producerBuildId "$PRODUCER_BUILD_ID" --arg scenario "$CANDIDATE_SCENARIO" --arg runId "$CANDIDATE_RUN_ID" \
            'select(.status == "waiting" and (.scope | type == "string") and (.principalId | type == "string")) |
             {scope, principalId, roleDefinitionId, allowedRoleDefinitionIds, condition, status,
              validationBuildId: $buildId, candidateSourceSha: $sourceSha, producerBuildId: $producerBuildId, scenario: $scenario, runId: $runId}' \
            "$proof" > "$public.tmp" 2>/dev/null; then
            mv "$public.tmp" "$public"
            echo "##vso[artifact.upload containerfolder=rbac-bootstrap;artifactname=candidate-rbac-bootstrap-$(Build.BuildId)-$CANDIDATE_SCENARIO-$(System.StageAttempt)-$(System.JobAttempt)]$public"
            return
          fi
          sleep 2
        done
      }
      publish_bootstrap &
      bootstrap_watcher=$!
      stop_bootstrap_watcher() {
        kill "$bootstrap_watcher" 2>/dev/null || true
        wait "$bootstrap_watcher" 2>/dev/null || true
        rm -f -- "$CANDIDATE_EVIDENCE/kubeconfig"
      }
      trap stop_bootstrap_watcher EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM
      "$PYTHON" -B "$CANDIDATE_ROOT/otelcollector/test/scenarios/run-scenario.py" run \
        --scenario "$CANDIDATE_SCENARIO" --run-id "$CANDIDATE_RUN_ID" --build-id "$PRODUCER_BUILD_ID" \
        --testkube-version 2.15.0 \
        "${retry_args[@]}" \
        --max-run-seconds "$max_run_seconds" \
        --source-root "$CANDIDATE_ROOT" --test-source-root "$CANDIDATE_ROOT" \
        --settings-root "$CANDIDATE_ROOT/otelcollector/test/scenarios/settings" \
        --receipt-tools-root "$BUILD_SOURCESDIRECTORY" --location "$CANDIDATE_LOCATION" \
        --tools-bin "$CANDIDATE_TOOLS" --evidence "$CANDIDATE_EVIDENCE"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    PRODUCER_BUILD_ID: ${{ parameters.producerBuildId }}
    CANDIDATE_SOURCE_SHA: ${{ parameters.sourceSha }}
    CANDIDATE_SCENARIO: ${{ parameters.scenario }}
    CANDIDATE_LOCATION: $(candidateLocation)
    CANDIDATE_ROOT: $(candidateRoot)
    CANDIDATE_EVIDENCE: $(candidateEvidence)
    CANDIDATE_TOOLS: $(candidateTools)
    PYTHON: $(candidatePython)/bin/python
    BUILD_BUILDID: $(Build.BuildId)
    SYSTEM_STAGEATTEMPT: $(System.StageAttempt)
    SYSTEM_JOBATTEMPT: $(System.JobAttempt)

- bash: |
    set -euo pipefail
    rm -f -- "$CANDIDATE_EVIDENCE/kubeconfig"
  displayName: "Always remove private candidate kubeconfig"
  condition: always()
  env:
    CANDIDATE_EVIDENCE: $(candidateEvidence)

- task: AzureCLI@2
  displayName: "Retain SRE-owned authenticated baseline/candidate scan comparison"
  condition: and(always(), not(canceled()), eq(variables['candidateScanPrerequisitesReady'], 'true'))
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/fetch_candidate.py" \
        --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
        --output "$CANDIDATE_EVIDENCE/pipeline-verification"
      "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/pr-e2e/scan_candidate.py" \
        --build-id "$PRODUCER_BUILD_ID" --source-commit "$CANDIDATE_SOURCE_SHA" \
        --baseline-image 'mcr.microsoft.com/azuremonitor/containerinsights/ciprod/prometheus-collector/images@sha256:195b238b026fcf7cfef5fddf66d4ea8b305ad093d99171b3079089a665030324' \
        --platform linux/amd64 --cve "$CANDIDATE_CVE" \
        --verified-candidate "$CANDIDATE_EVIDENCE/pipeline-verification" \
        --output "$CANDIDATE_EVIDENCE/scans"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    PRODUCER_BUILD_ID: ${{ parameters.producerBuildId }}
    CANDIDATE_SOURCE_SHA: ${{ parameters.sourceSha }}
    CANDIDATE_CVE: $(candidateCve)
    CANDIDATE_EVIDENCE: $(candidateEvidence)
    PYTHON: $(candidatePython)/bin/python

- bash: |
    set -euo pipefail
    rm -f "$CANDIDATE_EVIDENCE/kubeconfig"
    python3 -B "$BUILD_SOURCESDIRECTORY/.pipelines/candidate_evidence.py" \
      --evidence "$CANDIDATE_EVIDENCE" --output "$CANDIDATE_PUBLICATION" \
      --source-sha "$CANDIDATE_SOURCE_SHA" --producer-build-id "$PRODUCER_BUILD_ID"
  displayName: "Always stage credential-filtered source/build/execution evidence"
  condition: always()
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    PRODUCER_BUILD_ID: ${{ parameters.producerBuildId }}
    CANDIDATE_SOURCE_SHA: ${{ parameters.sourceSha }}
    CANDIDATE_EVIDENCE: $(candidateEvidence)
    CANDIDATE_PUBLICATION: $(candidatePublication)

- task: PublishTestResults@2
  displayName: "Always publish actual candidate TestKube JUnit"
  condition: always()
  inputs:
    testResultsFormat: JUnit
    searchFolder: $(candidatePublication)
    testResultsFiles: |
      */configprocessing/testkube-executions/**/artifacts/**/junit.xml
      */alias-ingestion/testkube-executions/**/artifacts/**/junit.xml
      health/**/artifacts/**/junit.xml
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
    testRunTitle: Candidate ${{ parameters.scenario }} producer ${{ parameters.producerBuildId }} source ${{ parameters.sourceSha }}

- bash: |
    set -euo pipefail
    "$PYTHON" -B "$BUILD_SOURCESDIRECTORY/.pipelines/candidate_coverage.py" \
      --root "$CANDIDATE_ROOT/otelcollector/test/scenarios" --scenario "$CANDIDATE_SCENARIO" \
      --output "$CANDIDATE_EVIDENCE/coverage.json" --require-unblocked
  displayName: "Gate candidate approval on complete scenario coverage"
  condition: always()
  env:
    CANDIDATE_ROOT: $(candidateRoot)
    CANDIDATE_EVIDENCE: $(candidateEvidence)
    CANDIDATE_SCENARIO: ${{ parameters.scenario }}
    PYTHON: $(candidatePython)/bin/python

- task: PublishPipelineArtifact@1
  displayName: "Always retain candidate TestKube, resource and SRE scan evidence"
  condition: always()
  inputs:
    targetPath: $(candidatePublication)
    artifact: candidate-configtests-$(candidateAttempt)
