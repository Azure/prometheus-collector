scrape_configs:
- job_name: controlplane-etcd
  scrape_interval: $$SCRAPE_INTERVAL$$
  follow_redirects: false
  scheme: https
  label_limit: 63
  label_name_length_limit: 511
  label_value_length_limit: 1023
  kubernetes_sd_configs:
    - role: endpoints
      namespaces:
        names:
          - $$POD_NAMESPACE$$
  tls_config:
    ca_file: /etc/kubernetes/secrets/etcd-client-ca.crt
    cert_file: /etc/kubernetes/secrets/etcd-client.crt
    key_file: /etc/kubernetes/secrets/etcd-client.key
    insecure_skip_verify: true
  relabel_configs:
    - source_labels: [ __meta_kubernetes_service_label_app, __meta_kubernetes_pod_container_port_number ]
      action: keep
      regex: etcd;2379
    - source_labels: [ __meta_kubernetes_pod_name ]
      regex: (.*)
      target_label: instance
      action: replace
    # Capture the etcd partition key (e.g. etcd, etcd-events, etcd-nodes) from the
    # etcd-operator's etcd_cluster pod label (value format: <key>-<CCPID>) into a stable
    # etcd_partition target label. Hyperscale control planes shard etcd into independent
    # clusters, so this lets a series be attributed to its partition without regex-parsing
    # the churny pod name in `instance`. Only the key is kept; the CCPID is redundant with
    # the `cluster` external label.
    # ORDER MATTERS: Prometheus relabel regexes are fully anchored and Go RE2 alternation is
    # leftmost-first, so the specific names (etcd-events...etcd2) MUST come before the bare
    # `etcd` branch. If `etcd` were first it would match `etcd-nodes-<id>` and wrongly capture
    # just "etcd". Do not reorder these alternatives.
    - source_labels: [ __meta_kubernetes_pod_label_etcd_cluster ]
      action: replace
      target_label: etcd_partition
      regex: (etcd-events|etcd-leases|etcd-nodes|etcd-pods|etcd-secrets|etcd2|etcd)-.*
      replacement: $$1
    - source_labels: [ __meta_kubernetes_pod_name ]
      action: drop
      regex: (etcd2-.*)
  metric_relabel_configs:
    # Generate host alias
    - source_labels: [ host ]
      action: hashmod
      regex: ^(.+)$
      modulus: 10000000000000000000 # take last 19 digits of the MD5 hash. (Prom won't let us take more than this)
      target_label: hostalias
    - source_labels: [ host ]
      regex: ^hcp-kubernetes.*.svc.cluster.local:443$
      target_label: hostalias
      replacement: kube-apiserver
    # Replace the host with hostalias
    - source_labels: [ hostalias, host ]
      regex: ^(.+);(.+)$
      action: replace
      target_label: host
    - source_labels: [ __name__ ]
      action: drop
      regex: (go_.*|process_(cpu|max|resident|virtual|open)_.*)
    - action: labeldrop
      regex: hostalias