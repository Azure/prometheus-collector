scrape_configs:
- job_name: controlplane-etcd
  scrape_interval: $$SCRAPE_INTERVAL$$
  follow_redirects: false
  # etcd's dedicated metrics listener (--listen-metrics-urls) serves only
  # /metrics and /health over plain HTTP. Unlike the client port it does not
  # mount the gRPC gateway, so it exposes no KV API and needs no client
  # certificate. Scraping it lets this collector drop the etcd-client-tls
  # credential, which grants full read/write access to every etcd key.
  scheme: http
  label_limit: 63
  label_name_length_limit: 511
  label_value_length_limit: 1023
  kubernetes_sd_configs:
    - role: endpoints
      namespaces:
        names:
          - $$POD_NAMESPACE$$
  relabel_configs:
    - source_labels: [ __meta_kubernetes_service_label_app, __meta_kubernetes_pod_container_port_number ]
      action: keep
      regex: etcd;2381
    - source_labels: [ __meta_kubernetes_pod_name ]
      regex: (.*)
      target_label: instance
      action: replace
    - source_labels: [ __meta_kubernetes_pod_name ]
      action: drop
      regex: (etcd2-.*)
  metric_relabel_configs:
    # Generate host alias
    - source_labels: [ host ]
      action: hashmod
      regex: ^(.+)$
      modulus: 10000000000000000000 # take last 19 digits of the MD5 hash. (Prom won't let us take more than this)
      target_label: hostalias
    - source_labels: [ host ]
      regex: ^hcp-kubernetes.*.svc.cluster.local:443$
      target_label: hostalias
      replacement: kube-apiserver
    # Replace the host with hostalias
    - source_labels: [ hostalias, host ]
      regex: ^(.+);(.+)$
      action: replace
      target_label: host
    - source_labels: [ __name__ ]
      action: drop
      regex: (go_.*|process_(cpu|max|resident|virtual|open)_.*)
    - action: labeldrop
      regex: hostalias