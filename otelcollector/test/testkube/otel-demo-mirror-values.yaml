default:
  image:
    repository: ciosstestimageacrmirror.azurecr.io/ghcr.io/open-telemetry/demo

components:
  accounting:
    initContainers:
      - name: wait-for-kafka
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  cart:
    initContainers:
      - name: wait-for-valkey-cart
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;
  checkout:
    initContainers:
      - name: wait-for-kafka
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  fraud-detection:
    initContainers:
      - name: wait-for-kafka
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  product-catalog:
    initContainers:
      - name: wait-for-astronomy-db
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;
  shipping:
    initContainers:
      - name: wait-for-flagd
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;
  flagd:
    imageOverride:
      repository: ciosstestimageacrmirror.azurecr.io/ghcr.io/open-feature/flagd
    initContainers:
      - name: init-config
        image: ciosstestimageacrmirror.azurecr.io/docker.io/library/busybox:latest
        command:
          - sh
          - -c
          - cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw
  valkey-cart:
    imageOverride:
      repository: ciosstestimageacrmirror.azurecr.io/ghcr.io/valkey-io/valkey
  astronomy-db:
    imageOverride:
      repository: ciosstestimageacrmirror.azurecr.io/docker.io/library/postgres

opensearch:
  image:
    repository: ciosstestimageacrmirror.azurecr.io/docker.io/opensearchproject/opensearch

prometheus:
  server:
    image:
      repository: ciosstestimageacrmirror.azurecr.io/quay.io/prometheus/prometheus

grafana:
  image:
    registry: ciosstestimageacrmirror.azurecr.io
    repository: docker.io/grafana/grafana
  sidecar:
    image:
      registry: ciosstestimageacrmirror.azurecr.io
      repository: quay.io/kiwigrid/k8s-sidecar

jaeger:
  jaeger:
    image:
      registry: ciosstestimageacrmirror.azurecr.io
      repository: docker.io/jaegertracing/jaeger

opentelemetry-collector:
  image:
    repository: ciosstestimageacrmirror.azurecr.io/docker.io/otel/opentelemetry-collector-contrib
