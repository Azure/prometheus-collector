apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: customersettingsv2
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  content:
    git:
      uri: https://github.com/Azure/prometheus-collector
      revision: $BRANCH_NAME
      paths:
        - otelcollector/test/ginkgo-e2e
  container:
    workingDir: /data/repo/otelcollector/test/ginkgo-e2e
    image: cerebro31/ginkgo-test:latest
    env:
      - name: GOTOOLCHAIN
        value: auto
  steps:
    - name: Run test
      shell: |
        ginkgo run --timeout=3h --label-filter "config-processing-customer-settings-v2" ./configprocessing
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
