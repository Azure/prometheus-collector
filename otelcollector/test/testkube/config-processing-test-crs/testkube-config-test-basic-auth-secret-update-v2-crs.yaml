apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
  name: basicauthsecretupdatev2
  namespace: testkube
spec:
  container:
    env:
    - name: AMW_QUERY_ENDPOINT
      value: $AMW_QUERY_ENDPOINT
    - name: AZURE_CLIENT_ID
      value: $AZURE_CLIENT_ID
    - name: GOTOOLCHAIN
      value: auto
  use:
  - config:
      labelFilter: (config-processing-basic-auth-secret-update-v2)
      parallelFlag: -p
      verboseFlag: -v
    name: configprocessingginkgo
