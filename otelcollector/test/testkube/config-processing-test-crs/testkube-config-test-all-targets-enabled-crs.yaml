apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: configprocessingcommon
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  use:
    - name: configprocessingginkgo
      config:
        labelFilter: "(config-processing-common, config-processing-common-with-config-maps)"
        parallelFlag: -p
  container:
    env:
      - name: AMW_QUERY_ENDPOINT
        value: "$AMW_QUERY_ENDPOINT"
      - name: AZURE_CLIENT_ID
        value: "$AZURE_CLIENT_ID"
      - name: GOTOOLCHAIN
        value: auto
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: alltargetsenabled
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  use:
    - name: configprocessingginkgo
      config:
        labelFilter: "(config-processing-all-targets-enabled)"
        parallelFlag: -p
  container:
    env:
      - name: AMW_QUERY_ENDPOINT
        value: "$AMW_QUERY_ENDPOINT"
      - name: AZURE_CLIENT_ID
        value: "$AZURE_CLIENT_ID"
      - name: GOTOOLCHAIN
        value: auto
