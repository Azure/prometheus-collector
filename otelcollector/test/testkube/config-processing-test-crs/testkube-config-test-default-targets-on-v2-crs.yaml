apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
  name: configprocessingcommonv2
  namespace: testkube
spec:
  container:
    env:
    - name: AMW_QUERY_ENDPOINT
      value: $AMW_QUERY_ENDPOINT
    - name: AZURE_CLIENT_ID
      value: $AZURE_CLIENT_ID
    - name: GOTOOLCHAIN
      value: auto
  use:
  - config:
      labelFilter: (config-processing-common, config-processing-common-with-config-maps-v2)
      parallelFlag: -p
    name: configprocessingginkgo
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
  name: defaultsettingsenabledv2
  namespace: testkube
spec:
  container:
    env:
    - name: AMW_QUERY_ENDPOINT
      value: $AMW_QUERY_ENDPOINT
    - name: AZURE_CLIENT_ID
      value: $AZURE_CLIENT_ID
    - name: GOTOOLCHAIN
      value: auto
  use:
  - config:
      labelFilter: (config-processing-default-targets-enabled)
      parallelFlag: -p
    name: configprocessingginkgo
