apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  config-version: transition-alias-cleared
  prometheus-collector-settings: |-
    operator_enabled = true
    cluster_alias = ""
  cluster-metrics: |-
    default-targets-scrape-enabled: |-
      windowskubeproxy = true
    pod-annotation-based-scraping: |-
      podannotationnamespaceregex = "^ama-settings-included$"
    default-targets-scrape-interval-settings: |-
      windowskubeproxy = "15s"
      podannotations = "15s"
    default-targets-metrics-keep-list: |-
      windowskubeproxy = "kubeproxy_sync_proxy_rules_duration_seconds.*"
      podannotations = "weather_.*"
