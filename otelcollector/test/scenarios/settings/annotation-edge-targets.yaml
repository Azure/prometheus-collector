apiVersion: v1
kind: Namespace
metadata:
  name: ama-settings-included-similar
---
apiVersion: v1
kind: Pod
metadata:
  name: annotation-target
  namespace: ama-settings-included-similar
  labels:
    app: ama-settings-annotation-target
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
    prometheus.io/path: /metrics
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  containers:
    - name: reference-app
      image: mcr.microsoft.com/azurelinux/base/python@sha256:379135d4dbe66b12825a54d4ed7aef21aa61227533ff1b9151d70f95f9266746
      command: ["python3", "-c"]
      args:
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; version=0.0.4")
                  self.end_headers()
                  self.wfile.write(b"weather_temperature 1\n")
          HTTPServer(("", 2112), Handler).serve_forever()
      ports:
        - name: metrics
          containerPort: 2112
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: unannotated-target
  namespace: ama-settings-included
  labels:
    app: ama-settings-unannotated-target
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  containers:
    - name: reference-app
      image: mcr.microsoft.com/azurelinux/base/python@sha256:379135d4dbe66b12825a54d4ed7aef21aa61227533ff1b9151d70f95f9266746
      command: ["python3", "-c"]
      args:
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; version=0.0.4")
                  self.end_headers()
                  self.wfile.write(b"weather_temperature 1\n")
          HTTPServer(("", 2112), Handler).serve_forever()
      ports:
        - name: metrics
          containerPort: 2112
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
