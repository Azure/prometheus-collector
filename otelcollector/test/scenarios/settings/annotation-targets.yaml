apiVersion: v1
kind: Namespace
metadata:
  name: ama-settings-included
---
apiVersion: v1
kind: Namespace
metadata:
  name: ama-settings-excluded
---
apiVersion: v1
kind: Pod
metadata:
  name: annotation-target
  namespace: ama-settings-included
  labels:
    app: ama-settings-annotation-target
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
    prometheus.io/path: /metrics
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  containers:
    - name: reference-app
      image: mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:6.27.0-main-04-23-2026-1bb78d89-ref-app-golang
      ports:
        - containerPort: 2112
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: annotation-target
  namespace: ama-settings-excluded
  labels:
    app: ama-settings-annotation-target
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
    prometheus.io/path: /metrics
spec:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  containers:
    - name: reference-app
      image: mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:6.27.0-main-04-23-2026-1bb78d89-ref-app-golang
      ports:
        - containerPort: 2112
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
