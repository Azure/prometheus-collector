apiVersion: v1
kind: Namespace
metadata:
  name: ama-secret-watch-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ama-secret-watch-test
  namespace: ama-secret-watch-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ama-secret-watch-test
  namespace: ama-secret-watch-test
subjects:
  - kind: ServiceAccount
    name: ama-metrics-serviceaccount
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ama-secret-watch-test
