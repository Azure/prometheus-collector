apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  config-version: regex-default
  cluster-metrics: |-
    default-targets-scrape-interval-settings: |-
      podannotations = "15s"
    default-targets-metrics-keep-list: |-
      podannotations = "weather_.*"
