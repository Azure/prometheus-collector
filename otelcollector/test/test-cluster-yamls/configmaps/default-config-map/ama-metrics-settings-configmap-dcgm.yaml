apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v1
  config-version: dcgm
  default-scrape-settings-enabled: |-
    dcgmexporter = true
  default-targets-scrape-interval-settings: |-
    dcgmexporter = "60s"
  default-targets-metrics-keep-list: |-
    minimalingestionprofile = true
    dcgmexporter = "DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_MEM_COPY_UTIL|DCGM_FI_DEV_POWER_USAGE"
