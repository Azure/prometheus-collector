apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  config-version: defaults2
  cluster-metrics: |-
    default-targets-scrape-enabled: |-
      kubelet = true
      coredns = false
      cadvisor = true
      kubeproxy = false
      apiserver = false
      kubestate = true
      nodeexporter = true
      windowsexporter = false
      windowskubeproxy = false
      kappiebasic = true
      networkobservabilityRetina = true
      networkobservabilityHubble = true
      networkobservabilityCilium = true
      acstor-capacity-provisioner = true
      acstor-metrics-exporter = true
      local-csi-driver = true
      dcgmexporter = true
      ztunnel = false
      istio-cni = false
      controlplane-istio = false
      prometheuscollectorhealth = false
    minimal-ingestion-profile: |-
      enabled = true
