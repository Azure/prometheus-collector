{{- if .Values.AzureMonitorMetrics.OperatorTargetsHttpsEnabled }}
{{/*
  mTLS secrets used between the ama-metrics collector replicaset and the target allocator.

  The config-reader sidecar generates the certificates and writes them into these secrets at
  startup. They are pre-created here, empty, so that the ama-metrics service account only needs
  `update` on these two fixed names rather than a cluster-wide `secrets: create` grant. RBAC
  cannot constrain `create` by resourceNames, so such a grant lets any holder of this service
  account's token create a Secret under a name the same account is also allowed to read.

  These are deliberately Helm *hooks* rather than ordinary chart resources:

    1. On any cluster that already ran a previous version these secrets exist and were created
       by the config-reader, so they carry no Helm ownership metadata. Ordinary chart resources
       are subject to Helm's adoption check and the upgrade fails with "rendered manifests
       contain a resource that already exists ... cannot be imported into the current release".
       Hooks are stored in release.Hooks rather than release.Manifest and skip that check.
    2. Hooks are not tracked in the release manifest, so Helm never prunes them. The config-
       reader replaces the whole object when it writes the certificates, which would otherwise
       drop the ownership metadata and make the *next* upgrade fail the same adoption check.

  The `lookup` guard means the hook is only rendered when the secret is genuinely absent, so an
  upgrade never deletes and recreates a populated secret and live certificates are preserved.
  `lookup` returns empty under `helm template` and `--dry-run`, but hooks are not executed in
  those modes, so rendering them there is harmless.
*/}}
{{- range $secretName := list "ama-metrics-operator-targets-server-tls-secret" "ama-metrics-operator-targets-client-tls-secret" }}
{{- if not (lookup "v1" "Secret" "kube-system" $secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: kube-system
  labels:
    component: ama-metrics-operator-targets
    kubernetes.azure.com/managedby: aks
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
{{- end }}
{{- end }}
{{- end }}
