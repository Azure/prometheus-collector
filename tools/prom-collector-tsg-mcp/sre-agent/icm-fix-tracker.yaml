# Azure SRE Agent scheduled task (schema mirrors coreai-microsoft/sreagent-templates
# .../AgentResources/scheduledtasks/daily-health-summary.yaml). Mirrors the live task on
# managed-prometheus-agent-tsg; needs the prom-collector-tsg MCP connector with
# toolsVisibleToMetaAgent: [prom-collector-tsg_tsg_fix_tracker_plan], or the agent can't see the tool.
api_version: azuresre.ai/v2
kind: ScheduledTask
metadata:
  name: icm-fix-tracker
  owner: AzureManagedPrometheusAgent
spec:
  description: Link fix PRs to active IcMs and post merge, image, rollout and release updates.
  cronExpression: '0 */4 * * *'
  agentPrompt: |
    Track fix PRs for active AzureManagedPrometheusAgent IcMs. Only post IcM discussion entries, add
    Fix PR tags and open draft fix PRs (step 6); never remove tags or change state, severity, owner, or mitigate/resolve an incident.

    1. List the team's ACTIVE incidents. For each, collect id, title, status, tags, and the text of
       every discussion entry. If the release channel (aks or arc) is stated in the incident,
       include it; otherwise omit it.
       For vulnerability incidents (CVE/FedRAMP/S360 findings), also set listedCves = the number of CVEs
       the incident lists (description and finding titles), and findings: one item per listed CVE, {id, evidence}.
       Verify EVERY listed CVE, never a subset, Windows included, against the image the incident names, the
       released Prod image and the rolling image (pull with crane/MCR):
       - Go: `go version -m` on every binary and .so for module versions and the Go version; compare with
         the fixed version on vuln.go.dev (a module the image does not contain is not present = fixed).
       - Windows/OS: os.version of each -win manifest (LTSC 2019 and 2022 separately) vs the FixedBuild for
         that OS in the MSRC CVRF (api.msrc.microsoft.com/cvrf/v3.0); .NET via its version vs the advisory.
         A CVE whose MSRC products exclude Server 2019/2022 is not applicable.
       Put that check in evidence (binary, version found, fixed version). Without evidence for every listed
       CVE the tool plans nothing for the incident: do not link, tag or post on it yourself either.
       Add fixedBy = URLs of open or merged Azure/prometheus-collector PRs whose diff or rolling image raises the
       affected module, package, Go version or base image to at least the fixed version (search PRs by CVE
       ID and package name; one CVE may need several PRs). Set fixed true only if the image already released
       to Prod (every variant) contains the fixed version. If unsure, leave the CVE without fixedBy or fixed:
       an open CVE is never reported as fixed.
    2. Gather Ev2 rollouts with ev2-mcp read tools only (serviceId 3170cdd2-19f0-4027-912b-1027311691a2;
       never start, approve, suspend or cancel a rollout). From the Prod endpoint only: list rollout
       history for the last 29 days (windows over 30 days are rejected) and keep DefinitionId 978,
       1196 and 1205. If the call fails, report it.
       For each kept rollout call get_rollout_summary and build one rollouts item:
       definitionId, endpoint, rolloutId, status, startTime, endTime (completed rollouts),
       sourceVersion = RolloutDetails.ReleasePipelineInfo.AzureDevOps.SourceVersion,
       artifactsVersion = RolloutDetails.ArtifactsRegistrationInfo.ArtifactsVersion,
       stages = StageInfos[] as {name: StageName, status: StageStatus}.
       For 978 rollouts only, also call get_rollout_details with filterActions shell/PushLinuxImage
       and includeStatusMessages true, and set push = {status, exitCode} from that action
       (exitCode from its EXITCODE#n message). Never copy log lines, tokens, identities or any other
       status-message text into the tool input, the IcM, or your report.
       Then build prodStages = {aks, arc}: for 1196 (aks) and 1205 (arc), read the Prod stage map with
       get_latest_stage_map (stage map name from get_or_list_stage_maps for this service) and list every
       region stage name in the form the rollout StageInfos use (e.g. Broad1.westus); skip __STAGE_PRECHECK__ and
       __ROLLOUT_PRE_CHECK__. Never derive the list from a rollout: a region Select leaves regions out. If the map
       cannot be read, omit that channel and report it; nothing on it is then counted as released.
    3. Call prom-collector-tsg_tsg_fix_tracker_plan with those incidents, lookbackHours 24, rollouts and prodStages.
    4. For each item in "entries", post its "text" verbatim as a discussion entry on incidentId.
       Do not post anything that is not in "entries", and do not reword the text: the trailing
       [ft:...] marker is how the next run avoids duplicates.
       If the item's state is "linked", also add the tag "Fix PR: <prUrl>" to incidentId unless it is
       already there; that tag is how the next run follows the PR.
    5. Before posting, re-read that incident's entries; skip the item if its marker is already there.
    6. For "needsFixPr", you may open draft fix PRs in Azure/prometheus-collector, one per incident's CVE set:
       - Only Go module CVEs whose module is required in go.mod on main of the product modules otelcollector,
         otelcollector/shared, otelcollector/shared/configmap/mp, otelcollector/shared/configmap/ccp or
         otelcollector/fluent-bit/src. Bump every one of those that requires the module, together.
       - Then run only `go mod tidy` (no `go get`) in each *-builder module that does `replace ../shared`
         (configuration-reader-builder, prom-config-validator-builder, opentelemetry-collector-builder), so
         their go.mod/go.sum change only as far as the shared bump forces.
       - Skip and report: Windows/OS/.NET and Go toolchain CVEs; modules that only appear in prometheusreceiver,
         otel-allocator, prometheus-ui or the *-builder modules (upgrade.sh owns those; they go in the OTel
         upgrade PR); and modules already at or above the fixed version on main ("fixed on main, awaiting
         release"). Never `go get` in an upgrade.sh-owned module.
       - Dedupe: first search open PRs (any author) for each CVE ID and module; if one covers them, don't open
         another. Reuse the branch sre-agent/fix-<lowest CVE ID, lowercase> if it already exists.
       - go.mod and go.sum must come from `go get <module>@<fixed version>` and `go mod tidy`. If `go` is not on
         PATH, download the toolchain named by `go` in otelcollector/go.mod from https://go.dev/dl/ into a
         mktemp dir under /tmp and use that binary; delete the dir afterwards. If you still cannot run Go,
         open nothing and report "manual fix PR needed".
       - Title "Bump <module> to <version> (<CVE IDs>)"; the body lists the CVEs, modules and osv.dev links.
         Never put IcM numbers, MSRC case numbers or incident links in the branch, commits or PR text.
       - Draft only. Never mark ready, approve, merge, or push to an existing non-sre-agent branch.
    7. Report what you posted and tagged, every item in "errors", every item in "needsFixPr", and each fix PR
       you opened (URL) or why none was opened. If the tool call fails, post nothing and open no PRs.
  status: Active
  agentMode: autonomous
