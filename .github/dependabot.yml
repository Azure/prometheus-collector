# To get started with Dependabot version updates, we will need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options: 
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Upstream-vendored / generated Go modules -- ignore everything.
  #
  # internal/otel-upgrade-scripts/upgrade.sh regenerates every go.mod listed below
  # from the upstream opentelemetry-collector-contrib and opentelemetry-operator
  # repos on each otelcollector upgrade:
  #   prometheusreceiver                 `rm -rf` + copy of contrib receiver/prometheusreceiver
  #   otel-allocator (+apis, +integrationtest)
  #                                      `rm -rf` + copy of operator cmd/otel-allocator
  #   opentelemetry-collector-builder    go.mod generated by ocb for the pinned collector version
  #   prom-config-validator-builder      go.mod copied wholesale from opentelemetry-collector-builder
  #
  # These dependency sets are only coherent as a whole -- upstream pins versions
  # that are built and tested together, so we cannot bump individual modules
  # without diverging from upstream. We deliberately stay on whatever upstream
  # ships, even when newer versions exist that upstream has not picked up yet.
  # Any Dependabot edit to these manifests is reverted by the next upgrade run.
  #
  # NOTE: a bare `ignore` (no `update-types`) suppresses Dependabot *security*
  # updates for these paths as well as version updates. That is intentional:
  # CVEs here are remediated by moving to a newer upstream otelcollector release
  # via upgrade.sh, and the shipped container images are still covered by the
  # Trivy scans in .github/workflows/scan.yml and scan-released-image.yml.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gomod"
    directories:
      - "/otelcollector/prometheusreceiver"
      - "/otelcollector/otel-allocator"
      - "/otelcollector/otel-allocator/apis"
      - "/otelcollector/otel-allocator/integrationtest"
      - "/otelcollector/opentelemetry-collector-builder"
      - "/otelcollector/prom-config-validator-builder"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Los_Angeles"
    ignore:
      - dependency-name: "*"
    open-pull-requests-limit: 0
    rebase-strategy: "auto"
  - package-ecosystem: "gomod"
    directory: "/otelcollector/fluent-bit/src" # out_appinsights package manifests
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
  - package-ecosystem: "gomod"
    directory: "/mixins/kubernetes/scripts" # ignore all here as this is promtool that we use to validate rules, and we don't ship the tool.
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Los_Angeles"
    ignore:
      - dependency-name: "*"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
  - package-ecosystem: "gomod"
    directory: "/internal/referenceapp/golang" # reference app package manifests
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
